      function InventoryAdjustmentPage({ products, fabrics, setProducts, setFabrics, setStocktakeRecords, onBack }) {
        const [draft, setDraft] = useState(createEmptyInventoryAdjustmentDraft);
        const updateDraft = (field, value) => setDraft((current) => ({ ...current, [field]: value }));
        const selectedProduct = products.find((product) => String(product.id) === String(draft.productId));
        const selectedFabric = fabrics.find((fabric) => `${fabric.id}::${fabric.lot || ""}` === draft.fabricKey);
        const selectedItem = draft.targetType === "products" ? selectedProduct : selectedFabric;
        const unit = draft.targetType === "fabrics" ? "公尺" : "件";
        const currentStock = draft.targetType === "fabrics" ? normalizeFabricQuantity(selectedItem?.stock) : Number(selectedItem?.stock) || 0;
        const qty = draft.targetType === "fabrics" ? normalizeFabricQuantity(draft.qty) : Number(draft.qty) || 0;
        const sign = ["出庫", "盤虧"].includes(draft.direction) ? -1 : 1;
        const nextStock = Math.max(currentStock + sign * qty, 0);

        const submit = (event) => {
          event.preventDefault();
          if (!selectedItem || qty <= 0) {
            alert("請選擇品項並填入正確的調整數量。正確格式：商品數量需為整數；布料數量以公尺計，可到小數點後 1 位，且不可為 0。");
            return;
          }

          if (draft.targetType === "products") {
            setProducts((current) =>
              current.map((product) => product.id === selectedProduct.id ? { ...product, stock: nextStock } : product)
            );
          } else {
            setFabrics((current) =>
              current.map((fabric) =>
                `${fabric.id}::${fabric.lot || ""}` === draft.fabricKey
                  ? { ...fabric, stock: normalizeFabricQuantity(nextStock), unit: "公尺" }
                  : fabric
              )
            );
            if (selectedFabric?.productId) {
              setProducts((current) =>
                current.map((product) =>
                  String(product.id) === String(selectedFabric.productId)
                    ? { ...product, stock: normalizeFabricQuantity(Math.max((Number(product.stock) || 0) + sign * qty, 0)) }
                    : product
                )
              );
            }
          }

          const record = {
            id: draft.id,
            date: draft.date,
            type: draft.targetType === "products" ? "商品" : "布料",
            itemId: draft.targetType === "products" ? selectedProduct.sku : `${selectedFabric.id} / ${selectedFabric.lot}`,
            itemName: selectedItem.name,
            beforeStock: currentStock,
            countedStock: nextStock,
            difference: sign * qty,
            unit,
            note: `${draft.reason}${draft.note ? `；${draft.note}` : ""}`,
          };
          setStocktakeRecords((current) => [record, ...current]);
          console.log("新增庫存調整單並更新庫存：", record);
          onBack();
        };

        return (
          <section className="mt-7 rounded-lg border border-neutral-200 bg-[#D6DEC9] shadow-sm">
            <DocFormHeader title="新建庫存調整單" helper="用於臨時入庫、出庫、盤盈或盤虧調整，送出後會更新庫存並留下紀錄。" onBack={onBack} submitLabel="建立調整單" />
            <form {...formValidationProps} id="flow-doc-form" onSubmit={submit} className="space-y-6 p-5">
              <OrderSection title="庫存調整資料" helper="布料調整需選到指定批號，數量以公尺計算到小數點後 1 位。">
                <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
                  <FormField label="調整單號"><input required value={draft.id} onChange={(event) => updateDraft("id", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="調整日期"><input required type="date" value={draft.date} onChange={(event) => updateDraft("date", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="調整類型">
                    <select value={draft.direction} onChange={(event) => updateDraft("direction", event.target.value)} className={inputClass}>
                      {["入庫", "出庫", "盤盈", "盤虧"].map((type) => <option key={type}>{type}</option>)}
                    </select>
                  </FormField>
                  <FormField label="品項類型">
                    <select value={draft.targetType} onChange={(event) => updateDraft("targetType", event.target.value)} className={inputClass}>
                      <option value="products">商品</option>
                      <option value="fabrics">布料</option>
                    </select>
                  </FormField>
                  {draft.targetType === "products" ? (
                    <FormField label="商品"><ProductSelectField products={products} value={draft.productId} onChange={(value) => updateDraft("productId", value)} /></FormField>
                  ) : (
                    <FormField label="布料批號">
                      <select required value={draft.fabricKey} onChange={(event) => updateDraft("fabricKey", event.target.value)} className={inputClass}>
                        <option value="">選擇布料批號</option>
                        {fabrics.map((fabric) => (
                          <option key={`${fabric.id}-${fabric.lot}`} value={`${fabric.id}::${fabric.lot || ""}`}>
                            {fabric.id} / {fabric.name} / {fabric.lot}（{formatFabricQuantity(fabric.stock)} 公尺）
                          </option>
                        ))}
                      </select>
                    </FormField>
                  )}
                  <FormField label={`調整數量（${unit}）`}>
                    <input required type="number" min={draft.targetType === "fabrics" ? "0.1" : "1"} step={draft.targetType === "fabrics" ? "0.1" : "1"} value={draft.qty} onChange={(event) => updateDraft("qty", event.target.value)} className={inputClass} />
                  </FormField>
                  <FormField label="調整原因"><input value={draft.reason} onChange={(event) => updateDraft("reason", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="調整前庫存"><input readOnly value={`${unit === "公尺" ? formatFabricQuantity(currentStock) : currentStock} ${unit}`} className={`${inputClass} bg-neutral-50 text-neutral-500`} /></FormField>
                  <FormField label="調整後庫存"><input readOnly value={`${unit === "公尺" ? formatFabricQuantity(nextStock) : nextStock} ${unit}`} className={`${inputClass} bg-neutral-50 text-neutral-500`} /></FormField>
                  <FormField label="備註"><input value={draft.note} onChange={(event) => updateDraft("note", event.target.value)} className={inputClass} /></FormField>
                </div>
              </OrderSection>
            </form>
          </section>
        );
      }

      function DocFormHeader({ title, helper, onBack, submitLabel }) {
        return (
          <div className="flex flex-col gap-4 border-b border-neutral-200 px-5 py-4 lg:flex-row lg:items-center lg:justify-between">
            <div>
              <p className="text-sm font-medium text-neutral-500">進/出貨作業</p>
              <h2 className="mt-1 text-2xl font-semibold tracking-tight text-neutral-950">{title}</h2>
            </div>
            <div className="flex gap-2">
              <button type="button" onClick={onBack} className="h-10 rounded-md border border-neutral-300 px-4 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950">
                返回列表
              </button>
              <button type="submit" form="flow-doc-form" className="h-10 rounded-md bg-neutral-950 px-4 text-sm font-medium text-white transition hover:bg-neutral-700">
                {submitLabel}
              </button>
            </div>
          </div>
        );
      }

      function StocktakePanel({ products, fabrics, setProducts, setFabrics, records, setRecords }) {
        const today = new Date().toISOString().slice(0, 10);
        const [entryMode, setEntryMode] = useState("single");
        const [targetType, setTargetType] = useState("products");
        const [targetId, setTargetId] = useState(products[0]?.id || "");
        const [countedQty, setCountedQty] = useState("");
        const [note, setNote] = useState("");
        const [batchCounts, setBatchCounts] = useState({});
        const [batchNote, setBatchNote] = useState("");
        const [stocktakeDate, setStocktakeDate] = useState(today);

        const targetOptions = targetType === "products" ? products : fabrics;
        const getTargetValue = (item) => targetType === "products" ? String(item.id) : `${item.id}::${item.lot || ""}`;
        const selectedItem = targetOptions.find((item) => getTargetValue(item) === String(targetId)) || targetOptions[0];
        const currentStock = targetType === "fabrics" ? normalizeFabricQuantity(selectedItem?.stock) : Number(selectedItem?.stock) || 0;
        const countedStock = countedQty === "" ? null : targetType === "fabrics" ? normalizeFabricQuantity(countedQty) : Number(countedQty);
        const difference =
          countedStock === null || Number.isNaN(countedStock)
            ? null
            : targetType === "fabrics"
              ? normalizeFabricQuantity(countedStock - currentStock)
              : countedStock - currentStock;
        const unit = targetType === "products" ? "件" : "公尺";
        const formatStocktakeQty = (value, itemUnit = unit) =>
          itemUnit === "公尺" ? formatFabricQuantity(value) : String(Number(value) || 0);
        const getItemKey = (item) => `${targetType}-${item.id}-${item.lot || ""}`;
        const batchRows = targetOptions.map((item) => {
          const itemKey = getItemKey(item);
          const itemUnit = targetType === "products" ? "件" : "公尺";
          const itemCurrentStock = targetType === "fabrics" ? normalizeFabricQuantity(item.stock) : Number(item.stock) || 0;
          const itemCountedValue = batchCounts[itemKey] ?? "";
          const isImplicitZeroCount = itemCountedValue === "" && itemCurrentStock !== 0;
          const itemCountedStock =
            itemCountedValue === ""
              ? (isImplicitZeroCount ? 0 : null)
              : targetType === "fabrics"
                ? normalizeFabricQuantity(itemCountedValue)
                : Number(itemCountedValue);
          const itemDifference =
            itemCountedStock === null || Number.isNaN(itemCountedStock)
              ? null
              : targetType === "fabrics"
                ? normalizeFabricQuantity(itemCountedStock - itemCurrentStock)
                : itemCountedStock - itemCurrentStock;
          return { item, itemKey, itemUnit, itemCurrentStock, itemCountedValue, itemCountedStock, itemDifference, isImplicitZeroCount };
        });
        const countedBatchRows = batchRows.filter((row) => row.itemCountedStock !== null && !Number.isNaN(row.itemCountedStock) && row.itemCountedStock >= 0);
        const manuallyFilledBatchRows = countedBatchRows.filter((row) => !row.isImplicitZeroCount);
        const implicitZeroBatchRows = countedBatchRows.filter((row) => row.isImplicitZeroCount);

        useEffect(() => {
          const nextOptions = targetType === "products" ? products : fabrics;
          setTargetId(nextOptions[0] ? (targetType === "products" ? String(nextOptions[0].id) : `${nextOptions[0].id}::${nextOptions[0].lot || ""}`) : "");
          setCountedQty("");
          setNote("");
          setBatchCounts({});
        }, [targetType, products, fabrics]);

        const submitStocktake = (event) => {
          event.preventDefault();
          if (!selectedItem || countedStock === null || Number.isNaN(countedStock) || countedStock < 0) {
            alert("請選擇盤點品項並填入正確的實盤數量。正確格式：商品實盤為 0 或正整數；布料實盤為 0 或正數，可到小數點後 1 位。");
            return;
          }

          const nextRecord = {
            id: `ST-${Date.now().toString().slice(-8)}`,
            date: stocktakeDate || today,
            type: targetType === "products" ? "商品" : "布料",
            itemId: selectedItem.id,
            itemName: selectedItem.name,
            beforeStock: currentStock,
            countedStock,
            difference,
            unit,
            note: note.trim() || "無",
          };

          if (targetType === "products") {
            setProducts((current) =>
              current.map((product) =>
                String(product.id) === String(selectedItem.id) ? { ...product, stock: countedStock } : product
              )
            );
          } else {
            setFabrics((current) =>
              current.map((fabric) =>
                String(fabric.id) === String(selectedItem.id) && fabric.lot === selectedItem.lot
                  ? { ...fabric, stock: normalizeFabricQuantity(countedStock), unit: "公尺" }
                  : fabric
              )
            );
          }

          setRecords((current) => [nextRecord, ...current]);
          setCountedQty("");
          setNote("");
          console.log("盤點完成並更新庫存：", nextRecord);
        };

        const updateBatchCount = (itemKey, value) => {
          setBatchCounts((current) => ({ ...current, [itemKey]: value }));
        };

        const clearBatchCounts = () => {
          setBatchCounts({});
          setBatchNote("");
        };

        const submitBatchStocktake = (event) => {
          event.preventDefault();
          if (countedBatchRows.length === 0) {
            alert("請至少輸入一項實盤數量，或確認目前有帳面庫存非 0 的未填項目。正確格式：商品實盤為 0 或正整數；布料實盤為 0 或正數，可到小數點後 1 位。");
            return;
          }

          const invalidRows = batchRows.filter((row) => {
            if (row.itemCountedValue === "") return false;
            return Number.isNaN(row.itemCountedStock) || row.itemCountedStock < 0;
          });
          if (invalidRows.length > 0) {
            alert("批量盤點中有不正確的實盤數量，請確認後再送出。正確格式：不可輸入負數；商品請輸入整數，布料可到小數點後 1 位。");
            return;
          }

          const nextRecords = countedBatchRows.map((row, index) => ({
            id: `ST-${Date.now().toString().slice(-8)}-${String(index + 1).padStart(2, "0")}`,
            date: stocktakeDate || today,
            type: targetType === "products" ? "商品" : "布料",
            itemId: row.item.id,
            itemName: row.item.name,
            beforeStock: row.itemCurrentStock,
            countedStock: row.itemCountedStock,
            difference: row.itemDifference,
            unit: row.itemUnit,
            note: row.isImplicitZeroCount
              ? `${batchNote.trim() || "定期批量盤點"}；未填實盤，視為 0`
              : batchNote.trim() || "定期批量盤點",
          }));
          const stockByKey = countedBatchRows.reduce((map, row) => {
            map[row.itemKey] = row.itemCountedStock;
            return map;
          }, {});

          if (targetType === "products") {
            setProducts((current) =>
              current.map((product) => {
                const itemKey = `products-${product.id}-`;
                return Object.prototype.hasOwnProperty.call(stockByKey, itemKey) ? { ...product, stock: stockByKey[itemKey] } : product;
              })
            );
          } else {
            setFabrics((current) =>
              current.map((fabric) => {
                const itemKey = `fabrics-${fabric.id}-${fabric.lot || ""}`;
                return Object.prototype.hasOwnProperty.call(stockByKey, itemKey)
                  ? { ...fabric, stock: normalizeFabricQuantity(stockByKey[itemKey]), unit: "公尺" }
                  : fabric;
              })
            );
          }

          setRecords((current) => [...nextRecords, ...current]);
          clearBatchCounts();
          console.log("批量盤點完成並更新庫存：", nextRecords);
        };

        return (
          <section className="overflow-hidden rounded-lg border border-neutral-200 bg-[#D6DEC9] shadow-sm">
            <div className="border-b border-neutral-200 px-5 py-4">
              <h2 className="text-lg font-semibold text-neutral-950">庫存盤點</h2>
              <div className="mt-4 inline-flex rounded-lg border border-neutral-200 bg-neutral-100 p-1">
                {[
                  { id: "single", label: "單筆盤點" },
                  { id: "batch", label: "批量盤點" },
                ].map((item) => (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => setEntryMode(item.id)}
                    className={`h-9 rounded-md px-3 text-sm font-medium transition ${
                      entryMode === item.id ? "bg-white text-neutral-950 shadow-sm" : "text-neutral-500 hover:text-neutral-900"
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </div>
            </div>

            {entryMode === "single" && (
            <form {...formValidationProps} onSubmit={submitStocktake} className="grid gap-4 border-b border-neutral-200 px-5 py-5 lg:grid-cols-6">
              <label className="lg:col-span-1">
                <span className="text-xs font-medium text-neutral-500">盤點日期</span>
                <input
                  type="date"
                  value={stocktakeDate}
                  onChange={(event) => setStocktakeDate(event.target.value)}
                  className={`${inputClass} mt-1`}
                />
              </label>
              <label className="lg:col-span-1">
                <span className="text-xs font-medium text-neutral-500">盤點類型</span>
                <select
                  value={targetType}
                  onChange={(event) => setTargetType(event.target.value)}
                  className={`${inputClass} mt-1`}
                >
                  <option value="products">商品</option>
                  <option value="fabrics">布料</option>
                </select>
              </label>
              <label className="lg:col-span-2">
                <span className="text-xs font-medium text-neutral-500">盤點品項</span>
                <select
                  value={targetId}
                  onChange={(event) => setTargetId(event.target.value)}
                  className={`${inputClass} mt-1`}
                >
                  {targetOptions.map((item) => (
                    <option key={`${targetType}-${item.id}-${item.lot || ""}`} value={getTargetValue(item)}>
                      {targetType === "products" ? `${item.sku} ${item.name}` : `${item.id} ${item.name} / ${item.lot}`}
                    </option>
                  ))}
                </select>
              </label>
              <div>
                <span className="text-xs font-medium text-neutral-500">帳面庫存</span>
                <div className="mt-1 flex h-10 items-center rounded-md border border-neutral-200 bg-white px-3 text-sm font-semibold text-neutral-950">
                  {selectedItem ? `${formatStocktakeQty(currentStock)} ${unit}` : "-"}
                </div>
              </div>
              <label>
                <span className="text-xs font-medium text-neutral-500">實盤數量</span>
                <input
                  type="number"
                  min="0"
                  step={targetType === "products" ? "1" : "0.1"}
                  value={countedQty}
                  onChange={(event) => setCountedQty(event.target.value)}
                  placeholder="輸入數量"
                  className={`${inputClass} mt-1`}
                />
              </label>
              <div>
                <span className="text-xs font-medium text-neutral-500">差異</span>
                <div className={`mt-1 flex h-10 items-center rounded-md border px-3 text-sm font-semibold ${
                  difference === null
                    ? "border-neutral-200 bg-white text-neutral-500"
                    : difference < 0
                      ? "border-rose-200 bg-rose-50 text-rose-700"
                      : difference > 0
                        ? "border-emerald-200 bg-emerald-50 text-emerald-700"
                        : "border-neutral-200 bg-white text-neutral-700"
                }`}>
                  {difference === null ? "-" : `${difference > 0 ? "+" : ""}${formatStocktakeQty(difference)} ${unit}`}
                </div>
              </div>
              <label className="lg:col-span-4">
                <span className="text-xs font-medium text-neutral-500">備註</span>
                <input
                  type="text"
                  value={note}
                  onChange={(event) => setNote(event.target.value)}
                  placeholder="例：門市盤點、倉庫抽盤、布料耗損調整"
                  className={`${inputClass} mt-1`}
                />
              </label>
              <div className="flex items-end lg:col-span-2">
                <button
                  type="submit"
                  className="h-10 w-full rounded-md bg-neutral-950 px-4 text-sm font-medium text-white transition hover:bg-neutral-700"
                >
                  確認盤點並更新庫存
                </button>
              </div>
            </form>
            )}

            {entryMode === "batch" && (
              <form {...formValidationProps} onSubmit={submitBatchStocktake} className="border-b border-neutral-200">
                <div className="grid gap-4 px-5 py-5 lg:grid-cols-6">
                  <label className="lg:col-span-1">
                    <span className="text-xs font-medium text-neutral-500">盤點日期</span>
                    <input
                      type="date"
                      value={stocktakeDate}
                      onChange={(event) => setStocktakeDate(event.target.value)}
                      className={`${inputClass} mt-1`}
                    />
                  </label>
                  <label className="lg:col-span-1">
                    <span className="text-xs font-medium text-neutral-500">盤點類型</span>
                    <select
                      value={targetType}
                      onChange={(event) => setTargetType(event.target.value)}
                      className={`${inputClass} mt-1`}
                    >
                      <option value="products">商品</option>
                      <option value="fabrics">布料</option>
                    </select>
                  </label>
                  <label className="lg:col-span-3">
                    <span className="text-xs font-medium text-neutral-500">批量備註</span>
                    <input
                      type="text"
                      value={batchNote}
                      onChange={(event) => setBatchNote(event.target.value)}
                      placeholder="例：2026 Q3 全店盤點"
                      className={`${inputClass} mt-1`}
                    />
                  </label>
                  <div className="flex items-end">
                    <button
                      type="button"
                      onClick={clearBatchCounts}
                      className="h-10 w-full rounded-md border border-neutral-300 bg-white px-4 text-sm font-medium text-neutral-700 transition hover:border-neutral-900 hover:text-neutral-950"
                    >
                      清空輸入
                    </button>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full min-w-[1040px] border-collapse text-left">
                    <thead className="bg-neutral-50 text-xs uppercase tracking-wide text-neutral-500">
                      <tr>
                        {["編碼", "品項", "分類/批號", "帳面庫存", "實盤數量", "差異"].map((heading) => (
                          <th key={heading} className="px-5 py-3 font-medium">{heading}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-neutral-100">
                      {batchRows.map((row) => (
                        <tr key={row.itemKey} className="transition hover:bg-neutral-50/80">
                          <td className="px-5 py-4 font-mono text-sm text-neutral-600">
                            {targetType === "products" ? row.item.sku : row.item.id}
                          </td>
                          <td className="px-5 py-4 font-medium text-neutral-950">{row.item.name}</td>
                          <td className="px-5 py-4 text-sm text-neutral-600">
                            {targetType === "products" ? row.item.category : row.item.lot}
                          </td>
                          <td className="px-5 py-4 text-sm font-semibold text-neutral-950">
                            {formatStocktakeQty(row.itemCurrentStock, row.itemUnit)} {row.itemUnit}
                          </td>
                          <td className="px-5 py-4">
                            <input
                              type="number"
                              min="0"
                              step={targetType === "products" ? "1" : "0.1"}
                              value={row.itemCountedValue}
                              onChange={(event) => updateBatchCount(row.itemKey, event.target.value)}
                              placeholder="未盤點"
                              className="h-10 w-32 rounded-md border border-neutral-300 bg-white px-3 text-sm outline-none transition placeholder:text-neutral-400 focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10"
                            />
                          </td>
                          <td className={`px-5 py-4 text-sm font-semibold ${
                            row.itemDifference === null
                              ? "text-neutral-400"
                              : row.itemDifference < 0
                                ? "text-rose-700"
                                : row.itemDifference > 0
                                  ? "text-emerald-700"
                                  : "text-neutral-600"
                          }`}>
                            {row.itemDifference === null ? (
                              "-"
                            ) : (
                              <span>
                                {row.itemDifference > 0 ? "+" : ""}{formatStocktakeQty(row.itemDifference, row.itemUnit)} {row.itemUnit}
                                {row.isImplicitZeroCount && (
                                  <span className="ml-2 text-xs font-medium text-rose-600">未填視為 0</span>
                                )}
                              </span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="flex flex-col gap-3 border-t border-neutral-200 px-5 py-4 sm:flex-row sm:items-center sm:justify-between">
                  <p className="text-sm text-neutral-500">
                    已填入 {manuallyFilledBatchRows.length} 項，另有 {implicitZeroBatchRows.length} 項未填但帳面庫存非 0，送出後會一併列為盤差。
                  </p>
                  <button
                    type="submit"
                    className="h-10 rounded-md bg-neutral-950 px-4 text-sm font-medium text-white transition hover:bg-neutral-700"
                  >
                    確認批量盤點並更新庫存
                  </button>
                </div>
              </form>
            )}

      function NewProductPage({ draft, setDraft, products, vendors, onBack, onSave }) {

            : categoryCode === "BG"

            : categoryCode === "BW"
              ? draft.buckwheatCategoryCode === "100G"

                : `BW-${draft.buckwheatCategoryCode || "60"}-${draft.buckwheatPartCode || "C"}`
            : categoryCode === "D"
              ? `D-${draft.dollAnimalCode || "B"}`
            : categoryCode === "G"
              ? draft.consignmentBrandCode === "S"
                ? `G-S-${draft.shiwangfangCategoryCode || "M"}`
                : `G-${draft.consignmentBrandCode || "E"}`
            : categoryCode;
        const usesConsignmentNativeCode =
          categoryCode === "G" && nativeCodeConsignmentBrandCodes.includes(draft.consignmentBrandCode);
        const productCode = usesConsignmentNativeCode
          ? `${skuCategoryCode}-${draft.consignmentNativeCode.trim() || "請輸入原生編碼"}`

        const selectedCategory = productCategories.find((category) => category.code === categoryCode);
        const selectedClothingCategory = clothingCategories.find(
          (category) => category.code === draft.clothingCategoryCode,

        const selectedBeddingCategory = beddingCategories.find(
          (category) => category.code === draft.beddingCategoryCode,
        );
        const selectedFittedSheetCategory = fittedSheetCategories.find(
          (category) => category.code === draft.fittedSheetCategoryCode,
        );
        const selectedFittedSheetSize = fittedSheetSizeCategories.find(
          (category) => category.code === draft.fittedSheetSizeCode,
        );
        const selectedBagMaterial = bagMaterialCategories.find(
          (category) => category.code === draft.bagMaterialCode,
        );
        const selectedBagStyle = bagStyleCategories.find(
          (category) => category.code === draft.bagStyleCode,
        );
        const selectedBambooBucketBagColor = bambooBucketBagColors.find(
          (category) => category.code === draft.bambooBucketBagColorCode,
        );
        const selectedBuckwheatCategory = buckwheatCategories.find(
          (category) => category.code === draft.buckwheatCategoryCode,

        const selectedBuckwheatPart = buckwheatPartCategories.find(
          (category) => category.code === draft.buckwheatPartCode,

        const selectedDollAnimal = dollAnimalCategories.find(
          (category) => category.code === draft.dollAnimalCode,

        const selectedDollColor = dollColorCategories.find(
          (category) => category.code === draft.dollColorCode,
        );
        const selectedConsignmentBrand = consignmentBrandCategories.find(
          (category) => category.code === draft.consignmentBrandCode,
        );
        const selectedShiwangfangCategory = shiwangfangCategories.find(
          (category) => category.code === draft.shiwangfangCategoryCode,

        const categoryLocked = draft.nature === "布料" || draft.nature === "組合";
        const inputClass = "h-10 w-full rounded-md border border-neutral-300 bg-white px-3 text-sm outline-none transition focus:border-neutral-950 focus:ring-2 focus:ring-neutral-950/10";

        const updateDraft = (field, value) => {
          setDraft((current) => ({ ...current, [field]: value }));

        const selectNature = (nature) => {
          setDraft((current) => ({

              nature === "布料" ? "F" :
              nature === "組合" ? "SET" :

        const selectImage = (event) => {
          const file = event.target.files?.[0];

          if (file.type !== "image/jpeg") {
            setImageError("僅支援 JPG／JPEG 圖片。");

              imageData: String(reader.result || ""),
              imageName: file.name,

        const submitProduct = (event) => {
          event.preventDefault();

            alert("請填寫產品名稱與標籤名稱。正確格式：兩欄皆為文字，標籤名稱會用於列印標籤。");

          onSave({

            name: draft.name.trim(),
            labelName: draft.labelName.trim(),
            color: draft.color.trim(),
            size: draft.size.trim(),
            specification: draft.specification.trim(),
            category: categoryCode === "SET" ? "組合" : selectedCategory?.label || categoryCode,
            categoryCode,
            subcategory:
              categoryCode === "C"
                ? selectedClothingCategory?.label || ""

                  ? selectedConsignmentBrand?.label || ""
                  : "",
            subcategoryCode:
              categoryCode === "C"
                ? draft.clothingCategoryCode

                  ? draft.consignmentBrandCode
                  : "",
            beddingCategory: categoryCode === "BE" ? selectedBeddingCategory?.label || "" : "",
            beddingCategoryCode: categoryCode === "BE" ? draft.beddingCategoryCode : "",
            fittedSheetCategory:
              categoryCode === "BE" && draft.beddingCategoryCode === "FS"
                ? selectedFittedSheetCategory?.label || ""
                : "",
            fittedSheetCategoryCode:
              categoryCode === "BE" && draft.beddingCategoryCode === "FS"
                ? draft.fittedSheetCategoryCode
                : "",
            fittedSheetSize:
              categoryCode === "BE" && draft.beddingCategoryCode === "FS"
                ? selectedFittedSheetSize?.label || ""
                : "",
            fittedSheetSizeCode:
              categoryCode === "BE" && draft.beddingCategoryCode === "FS"
                ? draft.fittedSheetSizeCode
                : "",
            bagMaterial: categoryCode === "BG" ? selectedBagMaterial?.label || "" : "",
            bagMaterialCode: categoryCode === "BG" ? draft.bagMaterialCode : "",
            bagStyle: categoryCode === "BG" ? selectedBagStyle?.label || "" : "",
            bagStyleCode: categoryCode === "BG" ? draft.bagStyleCode : "",
            bagColor:
              categoryCode === "BG" && draft.bagMaterialCode === "B" && draft.bagStyleCode === "B"
                ? selectedBambooBucketBagColor?.label || ""
                : "",
            bagColorCode:
              categoryCode === "BG" && draft.bagMaterialCode === "B" && draft.bagStyleCode === "B"
                ? draft.bambooBucketBagColorCode
                : "",
            buckwheatCategory: categoryCode === "BW" ? selectedBuckwheatCategory?.label || "" : "",
            buckwheatCategoryCode: categoryCode === "BW" ? draft.buckwheatCategoryCode : "",
            buckwheatPart:
              categoryCode === "BW" && draft.buckwheatCategoryCode !== "100G"
                ? selectedBuckwheatPart?.label || ""
                : "",
            buckwheatPartCode:
              categoryCode === "BW" && draft.buckwheatCategoryCode !== "100G"
                ? draft.buckwheatPartCode
                : "",
            dollAnimal: categoryCode === "D" ? selectedDollAnimal?.label || "" : "",
            dollAnimalCode: categoryCode === "D" ? draft.dollAnimalCode : "",
            dollColor: categoryCode === "D" ? selectedDollColor?.label || "" : "",
            dollColorCode: categoryCode === "D" ? draft.dollColorCode : "",
            consignmentBrand: categoryCode === "G" ? selectedConsignmentBrand?.label || "" : "",
            consignmentBrandCode: categoryCode === "G" ? draft.consignmentBrandCode : "",
            shiwangfangCategory:
              categoryCode === "G" && draft.consignmentBrandCode === "S"
                ? selectedShiwangfangCategory?.label || ""
                : "",
            shiwangfangCategoryCode:
              categoryCode === "G" && draft.consignmentBrandCode === "S"
                ? draft.shiwangfangCategoryCode
                : "",
            consignmentNativeCode: usesConsignmentNativeCode ? draft.consignmentNativeCode.trim() : "",
            price: Number(draft.retailPrice) || 0,
            retailPrice: Number(draft.retailPrice) || 0,
            wholesalePrice: Number(draft.wholesalePrice) || 0,
            purchaseCost: Number(draft.purchaseCost) || 0,
            vendorId: draft.vendorId,
            vendorName: vendors.find((vendor) => vendor.id === draft.vendorId)?.name || "",
            imageData: draft.imageData,
            imageName: draft.imageName,
            imageColor: "bg-neutral-200",
            stock: 0,

        };

        return (
          <form {...formValidationProps} onSubmit={submitProduct} className="mt-7 overflow-hidden rounded-lg border border-neutral-200 bg-[#D6DEC9] shadow-sm">
            <div className="flex flex-col gap-3 border-b border-neutral-200 px-5 py-4 sm:flex-row sm:items-center sm:justify-between">

                <h2 className="text-lg font-semibold text-neutral-950">新增商品資料</h2>

                <FormField label="分類">
                  <select

                  >
                    {categoryCode === "SET" && <option value="SET">組合（SET）</option>}
                    {productCategories.map((category) => (
                      <option key={category.code} value={category.code}>{category.label}（{category.code}）</option>
                    ))}
                  </select>
                </FormField>

                {categoryCode === "C" && (
                  <FormField label="第二層分類">
                    <select
                      value={draft.clothingCategoryCode}

                      className={inputClass}
                    >
                      {clothingCategories.map((category) => (
                        <option key={category.code} value={category.code}>
                          {category.label}（{category.code}）
                        </option>
                      ))}
                    </select>
                  </FormField>
                )}

                {categoryCode === "BE" && (
                  <FormField label="第二層分類">
                    <select
                      value={draft.beddingCategoryCode}
                      onChange={(event) => updateDraft("beddingCategoryCode", event.target.value)}
                      className={inputClass}
                    >
                      {beddingCategories.map((category) => (
                        <option key={category.code} value={category.code}>
                          {category.label}（{category.code}）
                        </option>
                      ))}
                    </select>
                  </FormField>
                )}

                {categoryCode === "BE" && draft.beddingCategoryCode === "FS" && (
                  <FormField label="第三層分類">
                    <select

                        </option>
                      ))}
                    </select>

                )}

                {categoryCode === "BE" && draft.beddingCategoryCode === "FS" && (
                  <FormField label="第四層分類">
                    <select

                      onChange={(event) => updateDraft("fittedSheetSizeCode", event.target.value)}
                      className={inputClass}
                    >
                      {fittedSheetSizeCategories.map((category) => (
                        <option key={category.code} value={category.code}>
                          {category.label}（{category.code}）
                        </option>

                    </select>
                  </FormField>

                {categoryCode === "BG" && (
                  <FormField label="第二層分類">
                    <select
                      value={draft.bagMaterialCode}
                      onChange={(event) => updateDraft("bagMaterialCode", event.target.value)}
                      className={inputClass}
                    >
                      {bagMaterialCategories.map((category) => (
                        <option key={category.code} value={category.code}>
                          {category.label}（{category.code}）
                        </option>
                      ))}
                    </select>
                  </FormField>
                )}

                {categoryCode === "BG" && (
                  <FormField label="第三層分類">
                    <select
                      value={draft.bagStyleCode}
                      onChange={(event) => updateDraft("bagStyleCode", event.target.value)}
                      className={inputClass}
                    >
                      {bagStyleCategories.map((category) => (
                        <option key={category.code} value={category.code}>
                          {category.label}（{category.code}）
                        </option>
                      ))}
                    </select>
                  </FormField>
                )}

                {categoryCode === "BG" && draft.bagMaterialCode === "B" && draft.bagStyleCode === "B" && (
                  <FormField label="第四層分類">
                    <select
                      value={draft.bambooBucketBagColorCode}
                      onChange={(event) => updateDraft("bambooBucketBagColorCode", event.target.value)}
                      className={inputClass}
                    >
                      {bambooBucketBagColors.map((category) => (
                        <option key={category.code} value={category.code}>
                          {category.label}（{category.code}）
                        </option>
                      ))}
                    </select>
                  </FormField>
                )}

                {categoryCode === "BW" && (
                  <FormField label="第二層分類">
                    <select
                      value={draft.buckwheatCategoryCode}
                      onChange={(event) => updateDraft("buckwheatCategoryCode", event.target.value)}
                      className={inputClass}
                    >
                      {buckwheatCategories.map((category) => (
                        <option key={category.code} value={category.code}>
                          {category.label}（{category.code}）
                        </option>
                      ))}
                    </select>
                  </FormField>
                )}

                {categoryCode === "BW" && draft.buckwheatCategoryCode !== "100G" && (
                  <FormField label="第三層分類">
                    <select
                      value={draft.buckwheatPartCode}
                      onChange={(event) => updateDraft("buckwheatPartCode", event.target.value)}
                      className={inputClass}
                    >
                      {buckwheatPartCategories.map((category) => (
                        <option key={category.code} value={category.code}>
                          {category.label}（{category.code}）
                        </option>
                      ))}
                    </select>
                  </FormField>
                )}

                {categoryCode === "D" && (
                  <FormField label="第二層分類">
                    <select
                      value={draft.dollAnimalCode}
                      onChange={(event) => updateDraft("dollAnimalCode", event.target.value)}
                      className={inputClass}
                    >
                      {dollAnimalCategories.map((category) => (
                        <option key={category.code} value={category.code}>

                      ))}
                    </select>
                  </FormField>
                )}

                  <FormField label="顏色">
                    <select
                      value={draft.dollColorCode}
                      onChange={(event) => updateDraft("dollColorCode", event.target.value)}
                      className={inputClass}
                    >
                      {dollColorCategories.map((category) => (
                        <option key={category.code} value={category.code}>
                          {category.label}（{category.code}）

                  </FormField>

                {categoryCode === "G" && (
                  <FormField label="第二層品牌">

                      value={draft.consignmentBrandCode}
                      onChange={(event) => updateDraft("consignmentBrandCode", event.target.value)}

                  </FormField>

                    <select
                      value={draft.shiwangfangCategoryCode}
                      onChange={(event) => updateDraft("shiwangfangCategoryCode", event.target.value)}
                      className={inputClass}
                    >
                      {shiwangfangCategories.map((category) => (
                        <option key={category.code} value={category.code}>
                          {category.label}（{category.code}）
                        </option>
                      ))}
                    </select>
                  </FormField>
                )}

                {usesConsignmentNativeCode && (
                  <FormField label="原生編碼">
                    <input
                      required
                      value={draft.consignmentNativeCode}
                      onChange={(event) => updateDraft("consignmentNativeCode", event.target.value)}
                      placeholder="輸入品牌原有商品編碼"
                      className={inputClass}
                    />
                  </FormField>
                )}

                <FormField label="產品代碼／SKU">
                  <input readOnly value={productCode} className={readonlyClass} />
                </FormField>

                <FormField label="產品名稱">
                  <input required value={draft.name} onChange={(event) => updateDraft("name", event.target.value)} placeholder="輸入完整產品名稱" className={inputClass} />
                </FormField>

                <FormField label="標籤名稱">
                  <input required value={draft.labelName} onChange={(event) => updateDraft("labelName", event.target.value)} placeholder="輸入列印於標籤的名稱" className={inputClass} />
                </FormField>

                <FormField label="顏色">
                  <input value={draft.color} onChange={(event) => updateDraft("color", event.target.value)} placeholder="例如：自然米、霧灰" className={inputClass} />
                </FormField>

                <FormField label="尺寸">
                  <input value={draft.size} onChange={(event) => updateDraft("size", event.target.value)} placeholder="例如：S、M、L 或 30 x 40 cm" className={inputClass} />

                <FormField label="採購商">
                  <select value={draft.vendorId} onChange={(event) => updateDraft("vendorId", event.target.value)} className={inputClass}>

                <FormField label="批發價">
                  <input type="number" min="0" value={draft.wholesalePrice} onChange={(event) => updateDraft("wholesalePrice", event.target.value)} placeholder="批發訂單自動帶入" className={inputClass} />
                </FormField>

                <FormField label="採購金額">
                  <input type="number" min="0" value={draft.purchaseCost} onChange={(event) => updateDraft("purchaseCost", event.target.value)} placeholder="輸入單件採購成本" className={inputClass} />
                </FormField>

              <aside>
                <span className="mb-2 block text-sm font-medium text-neutral-700">產品圖片</span>
                <label className="flex aspect-square cursor-pointer items-center justify-center overflow-hidden rounded-lg border border-dashed border-neutral-300 bg-neutral-50 text-center transition hover:border-neutral-950">
                  {draft.imageData ? (
                    <img src={draft.imageData} alt={draft.name || "產品圖片預覽"} className="h-full w-full object-cover" />

                    <span className="px-6 text-sm text-neutral-500">點選插入 JPG 圖片</span>

                {imageError && <p className="mt-2 text-sm text-red-600">{imageError}</p>}
                {draft.imageData && (
                  <button
                    type="button"
                    onClick={() => setDraft((current) => ({ ...current, imageData: "", imageName: "" }))}
                    className="mt-3 w-full rounded-md border border-neutral-300 px-3 py-2 text-sm font-medium text-neutral-700 transition hover:border-neutral-950"
                  >
                    移除圖片
                  </button>
                )}
              </aside>
            </div>
          </form>
        );
      }

      function DatabaseWorkspace({

        categoryRecords,
        setCategoryRecords,

        tailors,
        consignmentBrands,
        consignmentPoints,
        batches,

        partners,

        const [showUserModal, setShowUserModal] = useState(false);

        const [userDraft, setUserDraft] = useState(createEmptyUserDraft());
        const [userPasswordLocked, setUserPasswordLocked] = useState(false);

        const [passwordPromptError, setPasswordPromptError] = useState("");
        const [showCustomerModal, setShowCustomerModal] = useState(false);
        const [customerModalMode, setCustomerModalMode] = useState("create");
        const [customerDraft, setCustomerDraft] = useState(createEmptyCustomerDraft());
        const [showCategoryModal, setShowCategoryModal] = useState(false);
        const [categoryModalMode, setCategoryModalMode] = useState("create");
        const [categoryDraft, setCategoryDraft] = useState(createEmptyCategoryDraft());
        const [showPartnerModal, setShowPartnerModal] = useState(false);
        const [partnerDraft, setPartnerDraft] = useState(createEmptyPartnerDraft());

        const databaseTabs = [
          { id: "customers", label: "客戶資料", count: customers.length },
          { id: "users", label: "使用者資料", count: users.length },
          { id: "categories", label: "分類資料", count: categoryRecords.length },
          { id: "products", label: "商品資料", count: products.length },
          { id: "warehouses", label: "倉庫資料", count: warehouses.length },
          { id: "partners", label: "合作單位資料", count: partners.length },
          { id: "batches", label: "批號資料", count: batches.length },
        ];

        const activeTab = databaseTabs.find((tab) => tab.id === activeDatabase);

        const openCustomerModal = () => {
          setCustomerModalMode("create");
          setCustomerDraft(createEmptyCustomerDraft());
          setShowCustomerModal(true);
        };

        const editCustomer = (customer) => {
          setCustomerModalMode("edit");
          setCustomerDraft(createCustomerDraftFromRecord(customer));
          setShowCustomerModal(true);
        };

        const saveCustomer = (event) => {
          event.preventDefault();
          if (!customerDraft.name.trim() || !customerDraft.phone.trim()) {
            alert("請填寫會員名稱與電話。正確格式：會員名稱為文字；電話請輸入可聯絡的電話號碼，例如 0912345678。");
            return;
          }

          const savedCustomer = buildCustomerRecord(customerDraft, customers, customerModalMode);

          setCustomers((current) =>
            customerModalMode === "edit"
              ? current.map((customer) => (customer.id === savedCustomer.id ? savedCustomer : customer))
              : [savedCustomer, ...current]
          );
          setShowCustomerModal(false);
          setCustomerModalMode("create");
          setCustomerDraft(createEmptyCustomerDraft());
          console.log(customerModalMode === "edit" ? "更新客戶資料：" : "新增客戶資料：", savedCustomer);
        };

        const openUserModal = () => {
          setUserModalMode("create");
          setUserDraft(createEmptyUserDraft());
          setUserPasswordLocked(false);
          setShowUserModal(true);
        };

        const viewUser = (user) => {
          setUserModalMode("view");
          setUserDraft(createUserDraftFromRecord(user));
          setUserPasswordLocked(true);
          setShowUserModal(true);
        };

        const editUser = (user) => {
          const isAdminEditingOtherUser = ["U-001", "U-003"].includes(currentUser?.id) && currentUser.id !== user.id;
          if (!isAdminEditingOtherUser) {
            setPasswordPromptUser(user);
            setPasswordPromptInput("");
            setPasswordPromptError("");
            return;
          }
          setUserModalMode("edit");
          setUserDraft(createUserDraftFromRecord(user));
          setUserPasswordLocked(isAdminEditingOtherUser);
          setShowUserModal(true);
        };

        const confirmUserPasswordEdit = (event) => {
          event.preventDefault();
          if (!passwordPromptUser) return;
          if (passwordPromptInput.trim() !== String(passwordPromptUser.password || "000000")) {
            setPasswordPromptError("密碼不正確，無法開啟編輯。");
            return;
          }
          setUserModalMode("edit");
          setUserDraft(createUserDraftFromRecord(passwordPromptUser));
          setUserPasswordLocked(false);
          setPasswordPromptUser(null);
          setPasswordPromptInput("");
          setPasswordPromptError("");
          setShowUserModal(true);
        };

        const closeUserPasswordPrompt = () => {
          setPasswordPromptUser(null);
          setPasswordPromptInput("");
          setPasswordPromptError("");
        };

        const saveUser = (event) => {
          event.preventDefault();
          if (!userDraft.name.trim() || !userDraft.role) {
            alert("請填寫使用者名稱並選擇使用者類型。正確格式：名稱為文字；使用者類型請從下拉選單選擇。");
            return;
          }
          if (userDraft.account.trim() && !/^[a-zA-Z0-9]+$/.test(userDraft.account.trim())) {
            alert("帳號格式不正確。正確格式：僅可輸入英文字母與數字，不可包含空白或符號。");
            return;
          }
          if (!/^\d{6}$/.test(userDraft.password.trim())) {
            alert("密碼格式不正確。正確格式：密碼需為 6 位數字，例如 000000。");
            return;
          }
          const duplicatedAccount = users.some(
            (user) =>
              userDraft.account.trim() &&
              user.account === userDraft.account.trim() &&
              (userModalMode !== "edit" || user.id !== userDraft.id)
          );
          if (duplicatedAccount) {
            alert("此帳號已被其他使用者使用。正確格式：請輸入未被使用過的英數帳號，或將帳號欄留空。");
            return;
          }

          const numericIds = users
            .map((user) => Number(String(user.id).replace("U-", "")))
            .filter(Number.isFinite);
          const nextId = `U-${String((numericIds.length ? Math.max(...numericIds) : 0) + 1).padStart(3, "0")}`;
          const savedUser = {
            id: userModalMode === "edit" ? userDraft.id : nextId,
            name: userDraft.name.trim(),
            role: userDraft.role,
            account: userDraft.account.trim(),
            password: userPasswordLocked
              ? users.find((user) => user.id === userDraft.id)?.password || "000000"
              : userDraft.password.trim(),
            email: userDraft.email.trim(),
            phone: userDraft.phone.trim(),
            status: userDraft.status,
            warehouses: userDraft.warehouses.join("、"),
          };

          setUsers((current) => {
            const nextUsers =
              userModalMode === "edit"
                ? current.map((user) => (user.id === savedUser.id ? savedUser : user))
                : [savedUser, ...current];
            try {
              window.localStorage.setItem(userStorageKey, JSON.stringify(nextUsers));
            } catch (error) {
              console.warn("立即儲存使用者本機資料失敗。", error);
            }
            return nextUsers;
          });
          setShowUserModal(false);
          setUserModalMode("create");
          setUserDraft(createEmptyUserDraft());
          console.log(userModalMode === "edit" ? "更新使用者資料：" : "新增使用者資料：", savedUser);
        };

        const openCategoryModal = (defaults = {}) => {
          setCategoryModalMode("create");
          setCategoryDraft({ ...createEmptyCategoryDraft(), ...defaults });
          setShowCategoryModal(true);
        };

        const editCategory = (category) => {
          setCategoryModalMode("edit");
          setCategoryDraft({ ...category });
          setShowCategoryModal(true);
        };

        const saveCategory = (event) => {
          event.preventDefault();
          if (!categoryDraft.name.trim() || !categoryDraft.code.trim()) {
            alert("請填寫分類名稱與分類代碼。正確格式：分類名稱為文字；分類代碼請使用大寫英文字母或數字，例如 BE、FS、100G。");
            return;
          }

          const nextCategory = {
            ...categoryDraft,
            id:
              categoryModalMode === "edit"
                ? categoryDraft.id
                : `CAT-CUSTOM-${String(categoryRecords.length + 1).padStart(3, "0")}`,
            parent: categoryDraft.parent.trim() || "未指定",
            name: categoryDraft.name.trim(),
            code: categoryDraft.code.trim().toUpperCase(),
            status: categoryDraft.status || "啟用",
          };

          setCategoryRecords((current) =>
            categoryModalMode === "edit"
              ? current.map((category) => (category.id === nextCategory.id ? nextCategory : category))
              : [nextCategory, ...current]
          );
          setShowCategoryModal(false);
          setCategoryModalMode("create");
          setCategoryDraft(createEmptyCategoryDraft());
          console.log(categoryModalMode === "edit" ? "更新分類資料：" : "新增分類資料：", nextCategory);
        };

        const openPartnerModal = () => {
          setPartnerDraft(createEmptyPartnerDraft());
          setShowPartnerModal(true);
        };

        const savePartner = (event) => {
          event.preventDefault();
          if (!partnerDraft.name.trim() || !partnerDraft.category) {
            alert("請填寫合作單位名稱並選擇分類。正確格式：名稱為文字；分類請從進貨廠商、裁縫、寄售品牌、寄售點、攝影中選擇。");
            return;
          }

          const nextPartner = {
            ...partnerDraft,
            id: getPartnerId(partners, partnerDraft.category),
            name: partnerDraft.name.trim(),
            contact: partnerDraft.contact.trim(),
            phone: partnerDraft.phone.trim(),
            note: partnerDraft.note.trim(),
            status: partnerDraft.status || "合作中",
          };

          setPartners((current) => [nextPartner, ...current]);
          setShowPartnerModal(false);
          setPartnerDraft(createEmptyPartnerDraft());
          console.log("新增合作單位資料：", nextPartner);
        };

        return (
          <section className="mt-7 rounded-lg border border-neutral-200 bg-[#D6DEC9] shadow-sm">
            <div className="border-b border-neutral-200 px-5 py-4">
              <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
                <div>
                  <h2 className="text-lg font-semibold text-neutral-950">基本資料</h2>
                </div>
                <button
                  className="h-10 rounded-md bg-neutral-950 px-4 text-sm font-medium text-white transition hover:bg-neutral-700"
                  onClick={() => {
                    if (activeDatabase === "products") {
                      setActiveView("newProduct");
                      return;
                    }
                    if (activeDatabase === "customers") {
                      openCustomerModal();
                      return;
                    }
                    if (activeDatabase === "users") {
                      openUserModal();
                      return;
                    }
                    if (activeDatabase === "categories") {
                      openCategoryModal();
                      return;
                    }
                    if (activeDatabase === "partners") {
                      openPartnerModal();
                      return;
                    }
                    console.log(`新增${activeTab?.label || "資料"}`);
                  }}
                >
                  新增資料
                </button>
              </div>

            </div>

            <div className="p-5">
              {activeDatabase === "customers" && (
                <DatabaseTable
                  title="客戶資料"
                  helper="訂單、收件與出貨流程會共用這些客戶主檔。"
                  docs={customers}
                  columns={["id", "name", "phone", "recipient", "sevenStore", "familyStore", "email", "invoiceCarrier", "city", "district", "address"]}
                  onEdit={editCustomer}
                  onDocsChange={setCustomers}
                />
              )}
              {activeDatabase === "users" && (
                <DatabaseTable
                  title="使用者資料"
                  helper="管理內部使用者、角色、帳號狀態與登入密碼。"
                  docs={users}
                  columns={["id", "name", "account", "role", "status"]}
                  onView={viewUser}
                  onEdit={editUser}
                  onDocsChange={setUsers}
                />
              )}
              {activeDatabase === "categories" && (
                <CategoryDataPanel
                  categories={categoryRecords}
                  onAdd={openCategoryModal}
                  onEdit={editCategory}
                  onCategoriesChange={setCategoryRecords}
                />
              )}
              {activeDatabase === "products" && (
                <DatabaseTable
                  title="商品資料"
                  helper="商品主檔會被庫存、訂單、採購與批號資料共用。"
                  docs={products}
                  columns={["sku", "name", "category", "stock", "price", "status"]}
                  onDocsChange={setProducts}
                />
              )}
              {activeDatabase === "warehouses" && (
                <DatabaseTable
                  title="倉庫資料"
                  helper="管理庫存存放位置、倉庫類型與負責窗口。"
                  docs={warehouses}
                  columns={["id", "name", "type", "address", "manager", "status"]}
                />
              )}
              {activeDatabase === "partners" && (
                <DatabaseTable
                  title="合作單位資料"
                  helper="整合進貨廠商、裁縫、寄售品牌、寄售點與攝影等外部合作單位。"
                  docs={partners}
                  columns={["id", "category", "name", "contact", "phone", "note", "status"]}
                  onDocsChange={setPartners}
                />
              )}
              {activeDatabase === "batches" && (
                <DatabaseTable
                  title="批號資料"
                  helper="追蹤布料進貨批號、同批布料款式、收貨日期與目前可用庫存；布料不設定效期。"
                  docs={batches}
                  columns={["id", "fabricCount", "qty", "receivedDate", "status", "fabricItems"]}
                />
              )}
            </div>

            {showCustomerModal && (
              <CustomerFormModal
                draft={customerDraft}
                setDraft={setCustomerDraft}
                mode={customerModalMode}
                onClose={() => setShowCustomerModal(false)}
                onSubmit={saveCustomer}
              />
            )}
            {showUserModal && (
              <UserFormModal
                draft={userDraft}
                setDraft={setUserDraft}
                mode={userModalMode}
                passwordLocked={userPasswordLocked}
                onClose={() => setShowUserModal(false)}
                onSubmit={saveUser}
              />
            )}
            {passwordPromptUser && (
              <UserPasswordConfirmModal
                user={passwordPromptUser}
                password={passwordPromptInput}
                error={passwordPromptError}
                setPassword={setPasswordPromptInput}
                onClose={closeUserPasswordPrompt}
                onSubmit={confirmUserPasswordEdit}
              />
            )}
            {showCategoryModal && (
              <CategoryFormModal
                mode={categoryModalMode}
                draft={categoryDraft}
                setDraft={setCategoryDraft}
                onClose={() => setShowCategoryModal(false)}
                onSubmit={saveCategory}
              />
            )}
            {showPartnerModal && (
              <PartnerFormModal
                draft={partnerDraft}
                setDraft={setPartnerDraft}
                onClose={() => setShowPartnerModal(false)}
                onSubmit={savePartner}
              />
            )}
          </section>
        );
      }

      function UserPasswordConfirmModal({ user, password, error, setPassword, onClose, onSubmit }) {
        return (
          <div className="fixed inset-0 z-[60] flex items-center justify-center bg-neutral-950/35 px-4 py-6">
            <div className="w-full max-w-sm rounded-lg border border-neutral-200 bg-[#D6DEC9] shadow-xl">
              <div className="border-b border-neutral-100 px-5 py-4">
                <h3 className="text-lg font-semibold text-neutral-950">確認目前密碼</h3>
              </div>
              <form {...formValidationProps} onSubmit={onSubmit} className="space-y-4 p-5">
                <label className="block">
                  <span className="mb-2 block text-sm font-medium text-neutral-700">目前密碼</span>
                  <input
                    required
                    type="password"
                    inputMode="numeric"
                    maxLength="6"
                    value={password}
                    onChange={(event) => setPassword(event.target.value.replace(/\D/g, "").slice(0, 6))}
                    placeholder="輸入 6 位數字"
                    className="h-10 w-full rounded-md border border-neutral-300 bg-white px-3 text-sm outline-none transition placeholder:text-neutral-400 focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10"
                  />
                </label>
                {error && (
                  <div className="rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">
                    {error}
                  </div>
                )}
                <div className="flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="rounded-md border border-neutral-300 bg-white px-4 py-2 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950"
                  >
                    取消
                  </button>
                  <button type="submit" className="rounded-md bg-neutral-950 px-4 py-2 text-sm font-medium text-white transition hover:bg-neutral-700">
                    確認
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      function UserFormModal({ draft, setDraft, mode = "create", passwordLocked = false, onClose, onSubmit }) {
        const isViewMode = mode === "view";
        const canEditPassword = !isViewMode && !passwordLocked;
        const modalTitle =
          mode === "view" ? "查看使用者資料" : mode === "edit" ? "編輯使用者資料" : "新增使用者資料";
        const modalHelper =
          mode === "view"
            ? "檢視使用者基本資料、帳號類型與可見倉庫。"
            : mode === "edit"
              ? "修改使用者基本資料、帳號類型與可見倉庫。"
              : "建立使用者基本資料、帳號類型與可見倉庫。";
        const inputClass = "h-10 w-full rounded-md border border-neutral-300 bg-white px-3 text-sm outline-none transition placeholder:text-neutral-400 focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10";
        const readonlyClass = `${inputClass} disabled:bg-neutral-100 disabled:text-neutral-500 disabled:cursor-not-allowed`;

        const updateDraft = (field, value) => {
          setDraft((current) => ({ ...current, [field]: value }));
        };
        const visiblePasswordValue = (isViewMode || passwordLocked) && draft.password
          ? `${draft.password.slice(0, 1)}${"•".repeat(Math.max(0, draft.password.length - 1))}`
          : draft.password;

        const toggleWarehouse = (warehouse) => {
          setDraft((current) => {
            if (isViewMode) return current;
            const exists = current.warehouses.includes(warehouse);
            const warehouses = exists
              ? current.warehouses.filter((item) => item !== warehouse)
              : [...current.warehouses, warehouse];
            return { ...current, warehouses };
          });
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-neutral-950/35 px-4 py-6">
            <div className="w-full max-w-2xl rounded-lg border border-neutral-200 bg-[#D6DEC9] shadow-xl">
              <div className="flex items-start justify-between gap-4 border-b border-neutral-100 px-5 py-4">
                <div>
                  <h3 className="text-lg font-semibold text-neutral-950">{modalTitle}</h3>
                </div>
                <button
                  type="button"
                  onClick={onClose}
                  className="rounded-md border border-neutral-300 px-3 py-2 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950"
                >
                  關閉
                </button>
              </div>

              <form {...formValidationProps} onSubmit={onSubmit} className="space-y-5 p-5">
                <div className="grid gap-4 md:grid-cols-2">
                  <FormField label="使用者名稱（必填）">
                    <input
                      required
                      disabled={isViewMode}
                      value={draft.name}
                      onChange={(event) => updateDraft("name", event.target.value)}
                      placeholder="輸入使用者名稱"
                      className={readonlyClass}
                    />
                  </FormField>

                  <FormField label="使用者類型（必填）">
                    <select
                      required
                      disabled={isViewMode}
                      value={draft.role}
                      onChange={(event) => updateDraft("role", event.target.value)}
                      className={readonlyClass}
                    >
                      {userTypeOptions.map((type) => (
                        <option key={type} value={type}>{type}</option>
                      ))}
                    </select>
                  </FormField>

                  <FormField label="帳號（英數字）">
                    <input
                      disabled={isViewMode}
                      pattern="[A-Za-z0-9]+"
                      value={draft.account}
                      onChange={(event) => updateDraft("account", event.target.value.replace(/[^a-zA-Z0-9]/g, ""))}
                      placeholder="例如 nozomi"
                      autoComplete="username"
                      className={readonlyClass}
                    />
                  </FormField>

                  <FormField label="密碼（必填，6 位數字）">
                    <input
                      required
                      disabled={!canEditPassword}
                      type={canEditPassword ? "password" : "text"}
                      inputMode="numeric"
                      maxLength="6"
                      pattern="[0-9]{6}"
                      value={visiblePasswordValue}
                      onChange={(event) => updateDraft("password", event.target.value.replace(/\D/g, "").slice(0, 6))}
                      placeholder="輸入 6 位數字"
                      autoComplete={mode === "create" ? "new-password" : "current-password"}
                      className={readonlyClass}
                    />
                    {passwordLocked && (
                      <p className="mt-2 text-xs text-neutral-500">管理者編輯其他使用者時不可修改密碼。</p>
                    )}
                  </FormField>

                  <FormField label="E-mail">
                    <input
                      type="email"
                      disabled={isViewMode}
                      value={draft.email}
                      onChange={(event) => updateDraft("email", event.target.value)}
                      placeholder="name@example.com"
                      className={readonlyClass}
                    />
                  </FormField>

                  <FormField label="連絡電話">
                    <input
                      disabled={isViewMode}
                      value={draft.phone}
                      onChange={(event) => updateDraft("phone", event.target.value)}
                      placeholder="輸入電話"
                      className={readonlyClass}
                    />
                  </FormField>

                  <FormField label="使用者狀態">
                    <select
                      disabled={isViewMode}
                      value={draft.status}
                      onChange={(event) => updateDraft("status", event.target.value)}
                      className={readonlyClass}
                    >
                      {userStatusOptions.map((status) => (
                        <option key={status} value={status}>{status}</option>
                      ))}
                    </select>
                  </FormField>

                  <div className="md:col-span-2">
                    <span className="mb-2 block text-sm font-medium text-neutral-700">可見倉庫</span>
                    <div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
                      {warehouseOptions.map((warehouse) => (
                        <label
                          key={warehouse}
                          className="flex items-center gap-2 rounded-md border border-neutral-200 bg-neutral-50 px-3 py-2 text-sm text-neutral-700"
                        >
                          <input
                            type="checkbox"
                            disabled={isViewMode}
                            checked={draft.warehouses.includes(warehouse)}
                            onChange={() => toggleWarehouse(warehouse)}
                            className="h-4 w-4 rounded border-neutral-300 text-neutral-950 focus:ring-neutral-900 disabled:cursor-not-allowed"
                          />
                          {warehouse}
                        </label>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-3 border-t border-neutral-100 pt-4">
                  <button
                    type="button"
                    onClick={onClose}
                    className="h-10 rounded-md border border-neutral-300 px-4 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950"
                  >
                    取消
                  </button>
                  {!isViewMode && (
                    <button
                      type="submit"
                      className="h-10 rounded-md bg-neutral-950 px-4 text-sm font-medium text-white transition hover:bg-neutral-700"
                    >
                      {mode === "edit" ? "儲存修改" : "儲存使用者"}
                    </button>
                  )}
                </div>
              </form>
            </div>
          </div>
        );
      }

      function PartnerFormModal({ draft, setDraft, onClose, onSubmit }) {
        const inputClass = "h-10 w-full rounded-md border border-neutral-300 bg-white px-3 text-sm outline-none transition placeholder:text-neutral-400 focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10";
        const updateDraft = (field, value) => {
          setDraft((current) => ({ ...current, [field]: value }));
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-neutral-950/35 px-4 py-6">
            <div className="w-full max-w-2xl rounded-lg border border-neutral-200 bg-[#D6DEC9] shadow-xl">
              <div className="flex items-start justify-between gap-4 border-b border-neutral-100 px-5 py-4">
                <div>
                  <h3 className="text-lg font-semibold text-neutral-950">新增合作單位資料</h3>
                </div>
                <button
                  type="button"
                  onClick={onClose}
                  className="rounded-md border border-neutral-300 px-3 py-2 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950"
                >
                  關閉
                </button>

      function getRecordKey(record) {
        return String(record.id || record.sku || record.code || record.name);
      }

      function getRecordSearchText(record, columns = []) {
        const values = columns.length ? columns.map((column) => record[column]) : Object.values(record);
        return values.join(" ").toLowerCase();
      }

      function getRecordStatus(record, columns = []) {
        if (record.status) return record.status;
        if (columns.includes("stock") && columns.includes("price")) return record.stock < 10 ? "低庫存" : "正常";
        return "";
      }

      function applyBulkRecordAction(records, selectedIds, action) {
        const selectedSet = new Set(selectedIds);
        if (action === "delete") return records.filter((record) => !selectedSet.has(getRecordKey(record)));

        return records.map((record) => {
          if (!selectedSet.has(getRecordKey(record))) return record;
          if (action === "enable") return { ...record, status: "啟用" };
          if (action === "disable") return { ...record, status: "停用" };
          return record;
        });
      }

        const [selectedIds, setSelectedIds] = useState([]);
        const statusOptions = Array.from(new Set(categories.map((category) => category.status).filter(Boolean)));
        const visibleCategories = categories.filter((category) => {
          const matchesGroup = groupFilter === "all" || category.group === groupFilter;
          const matchesStatus = statusFilter === "all" || category.status === statusFilter;
          const matchesSearch = getRecordSearchText(category).includes(searchTerm.trim().toLowerCase());
          return matchesGroup && matchesStatus && matchesSearch;
        });
        const visibleIds = visibleCategories.map(getRecordKey);
        const allVisibleSelected = visibleIds.length > 0 && visibleIds.every((id) => selectedIds.includes(id));
        const categoriesByGroup = categoryGroupOptions
          .map((group) => {
            const items = visibleCategories.filter((category) => category.group === group);
            const fallbackParent = categories.find((category) => category.group === group)?.parent || "";
            return { group, parent: items[0]?.parent || fallbackParent, items };

          .filter((section) => groupFilter === "all" || section.group === groupFilter);

        const toggleSelection = (id) => {

        const toggleAllVisible = () => {

            return Array.from(new Set([...current, ...visibleIds]));
