      function normalizeUserRecords(users) {
        const sourceUsers = Array.isArray(users) ? users : userRecords;
        const normalizedUsers = sourceUsers.map((user) => ({
          ...user,
          account: user.account || user.username || "",
          password: /^\d{6}$/.test(String(user.password || "")) ? String(user.password) : "000000",
        }));
        const hasNozomi = normalizedUsers.some((user) => user.id === "U-003");
        if (!hasNozomi) {
          normalizedUsers.push(userRecords.find((user) => user.id === "U-003"));
        }
        return normalizedUsers.sort((a, b) => String(a.id).localeCompare(String(b.id), "zh-Hant"));
      }

      function buildCustomerRecord(customerDraft, customers, mode = "create") {
        const numericIds = customers
          .map((customer) => Number(String(customer.id).replace("C-", "")))
          .filter(Number.isFinite);
        const nextId = `C-${String((numericIds.length ? Math.max(...numericIds) : 0) + 1).padStart(3, "0")}`;
        const fullAddress = customerDraft.address.trim();

        return {
          id: mode === "edit" ? customerDraft.id : nextId,
          name: customerDraft.name.trim(),
          phone: customerDraft.phone.trim(),
          keyword: customerDraft.name.trim(),
          recipient: customerDraft.recipient.trim(),
          sevenStore: customerDraft.sevenStore.trim(),
          familyStore: customerDraft.familyStore.trim(),
          email: customerDraft.email.trim(),
          invoiceCarrier: customerDraft.invoiceCarrier.trim(),
          city: customerDraft.city.trim(),

            便利帶: fullAddress,
            "7-11": customerDraft.sevenStore.trim(),
            全家: customerDraft.familyStore.trim(),
            其他: fullAddress,
          },
        };
      }

      function loadHomeSectionOrder() {
        const defaultOrder = ["totalProducts", "totalStock", "lowStock", "pendingOrders", "pendingPurchases", "calendar", "orders", "preorders"];
        try {
          const storedOrder = window.localStorage.getItem(homeSectionStorageKey);
          if (!storedOrder) return defaultOrder;
          const parsedOrder = JSON.parse(storedOrder);
          const validOrder = Array.isArray(parsedOrder)
            ? parsedOrder.filter((item) => defaultOrder.includes(item))
            : [];
          return [...validOrder, ...defaultOrder.filter((item) => !validOrder.includes(item))];
        } catch (error) {
          console.warn("讀取首頁區塊排序失敗，改用預設排序。", error);
          return defaultOrder;
        }
      }

      function loadHomeHiddenSections() {
        const allSections = ["totalProducts", "totalStock", "lowStock", "pendingOrders", "pendingPurchases", "calendar", "orders", "preorders"];
        try {
          const storedHidden = window.localStorage.getItem(homeSectionVisibilityStorageKey);
          if (storedHidden) {
            const parsedHidden = JSON.parse(storedHidden);
            return Array.isArray(parsedHidden) ? parsedHidden.filter((item) => allSections.includes(item)) : [];
          }

          const legacyLayout = window.localStorage.getItem(metricCardStorageKey);
          if (!legacyLayout) return [];
          const parsedLegacyLayout = JSON.parse(legacyLayout);
          return Array.isArray(parsedLegacyLayout.hidden)
            ? parsedLegacyLayout.hidden.filter((item) => allSections.includes(item))
            : [];
        } catch (error) {
          console.warn("讀取首頁區塊顯示設定失敗，改用預設設定。", error);
          return [];
        }
      }

      function loadMetricCardLayout() {
        const defaultOrder = ["totalProducts", "totalStock", "lowStock", "pendingOrders", "pendingPurchases"];
        try {
          const storedLayout = window.localStorage.getItem(metricCardStorageKey);
          if (!storedLayout) return { order: defaultOrder, hidden: [] };
          const parsedLayout = JSON.parse(storedLayout);
          const storedOrder = Array.isArray(parsedLayout.order) ? parsedLayout.order : [];
          const storedHidden = Array.isArray(parsedLayout.hidden) ? parsedLayout.hidden : [];
          const order = [
            ...storedOrder.filter((item) => defaultOrder.includes(item)),
            ...defaultOrder.filter((item) => !storedOrder.includes(item)),
          ];
          const hidden = storedHidden.filter((item) => defaultOrder.includes(item));
          return { order, hidden };
        } catch (error) {
          console.warn("讀取首頁指標卡設定失敗，改用預設設定。", error);
          return { order: defaultOrder, hidden: [] };
        }
      }

              const existingSources = new Set(current.map((shipment) => shipment.source));
              const nextShipments = transferableOrders
                .filter((order) => !existingSources.has(order.id))
                .map((order, index) => createShipmentFromOrder(order, productMap, index));
              return nextShipments.length > 0 ? [...nextShipments, ...current] : current;
            });
          }

          setOrders(retainedOrders);
          console.log("依規則整理現有訂單：", { transferred: transferableOrders, retained: retainedOrders });
        }, [orders, productMap]);

        const filteredProducts = useMemo(() => {
          const keyword = searchKeyword.trim().toLowerCase();
          return products.filter((product) => {
            const matchesKeyword =
              product.name.toLowerCase().includes(keyword) ||
              product.sku.toLowerCase().includes(keyword);
            const matchesStockFilter = stockFilter === "all" || product.stock < 10;
            return matchesKeyword && matchesStockFilter;
          });
        }, [products, searchKeyword, stockFilter]);

        const filteredFabrics = useMemo(() => {
          const keyword = searchKeyword.trim().toLowerCase();
          return fabrics.filter((fabric) => {
            const matchesKeyword =
              fabric.name.toLowerCase().includes(keyword) ||
              fabric.id.toLowerCase().includes(keyword) ||
              fabric.lot.toLowerCase().includes(keyword);
            const matchesStockFilter = stockFilter === "all" || fabric.stock < fabric.safetyStock;
            return matchesKeyword && matchesStockFilter;
          });
        }, [fabrics, searchKeyword, stockFilter]);

        const metrics = {
          totalProducts: products.length,
          totalStock: products.reduce((sum, product) => sum + product.stock, 0),
          lowStock: products.filter((product) => product.stock < 10).length,
          pendingOrders: orders.length,
          pendingPurchases: purchases.length,
        };

        const secondaryNavigation = (() => {
          if (activeView === "dashboard") {
            return {
              activeId: activeInventory,
              onSelect: (id) => {
                setActiveInventory(id);
                setSearchKeyword("");
                setStockFilter("all");
              },
              items: [
                { id: "products", label: "商品庫存", count: products.length },
                { id: "fabrics", label: "布料庫存", count: fabrics.length },
              ],
            };
          }

          if (activeView === "flow" || activeView === "newOrder") {
            return {
              activeId: activeFlow,
              onSelect: (id) => {
                setActiveFlow(id);
                setActiveView("flow");
              },
              items: [
                { id: "inventory", label: "庫存管理", count: products.length + fabrics.length },
                { id: "orders", label: "訂單", count: orders.length },
                { id: "shipments", label: "出貨單", count: shipments.length },
                { id: "purchases", label: "採購單", count: purchases.length },
                { id: "receipts", label: "進貨單", count: receipts.length },
                { id: "consignment", label: "寄售/快閃", count: consignmentDocs.length },
              ],
            };
          }

          if (activeView === "database" || activeView === "newProduct") {
            return {
              activeId: activeDatabase,
              onSelect: setActiveDatabase,
              items: [
                { id: "customers", label: "客戶資料", count: customers.length },
                { id: "users", label: "使用者資料", count: users.length },
                { id: "categories", label: "分類資料", count: categoryRecords.length },
                { id: "products", label: "商品資料", count: products.length },
                { id: "warehouses", label: "倉庫資料", count: warehouseRecords.length },
                { id: "partners", label: "合作單位資料", count: partners.length },
                { id: "batches", label: "批號資料", count: visibleBatches.length },
              ],
            };
          }

          if (activeView === "affairs") {
            return {
              activeId: activeAffairs,
              onSelect: setActiveAffairs,
              items: [
                { id: "pettyCash", label: "零用金管理", count: pettyCashRecords.length },
                { id: "labelPrint", label: "標籤列印", count: labelPrintJobs.length },
                { id: "calendar", label: "行事曆/班表", count: calendarShifts.length },
                { id: "tasks", label: "指派任務", count: assignedTaskRecords.length },
              ],
            };
          }

          return {
            activeId: activeHome,
            onSelect: setActiveHome,
            items: [],
          };
        })();

        const transferOrderToShipment = (orderInput) => {
          const order = typeof orderInput === "string" ? orders.find((item) => item.id === orderInput) : orderInput;
          if (!order) return false;

          if (!canTransferOrderToShipment(order)) {
            alert("訂單已出貨但尚未完成出貨單號或發票號碼，暫不移入出貨單。");
            return false;
          }

          const orderItems = getOrderInventoryItems(order, productMap, { remainingOnly: true });
          const hasMissingFabricBatch = orderItems.some((item) => isFabricProduct(item.product) && !String(item.batchNo || "").trim());
          const hasInsufficientStock = orderItems.some((item) => {
            if (!item.product) return false;
            if (!isFabricProduct(item.product)) return item.product.stock < item.qty;
            const fabricLot = getFabricLotsForProduct(fabrics, item.product).find((fabric) => fabric.lot === item.batchNo);
            return !fabricLot || normalizeFabricQuantity(fabricLot.stock) < item.qty;
          });
          const hasCustomOnlyItems = orderItems.some((item) => !item.product);

          if (hasInsufficientStock || hasCustomOnlyItems || hasMissingFabricBatch) {
            console.log("庫存不足，不能完成出貨：", order);
            alert("目前有商品庫存不足、布料批號未填，或商品尚未建立主檔，請先確認資料。");
            return false;
          }

          const stockByFabricLot = orderItems.reduce((map, item) => {
            if (isFabricProduct(item.product)) {
              map[item.batchNo] = (map[item.batchNo] || 0) + item.qty;
            }
            return map;
          }, {});

          const stockByProductId = orderItems.reduce((map, item) => {
            if (item.product) map[item.product.id] = (map[item.product.id] || 0) + item.qty;
            return map;
          }, {});

          setProducts((current) =>
            current.map((product) => (
              stockByProductId[product.id]
                ? {
                    ...product,
                    stock: isFabricProduct(product)
                      ? normalizeFabricQuantity((Number(product.stock) || 0) - stockByProductId[product.id])
                      : (Number(product.stock) || 0) - stockByProductId[product.id],
                  }
                : product
            ))
          );
          setFabrics((current) =>
            current.map((fabric) => (
              stockByFabricLot[fabric.lot]
                ? { ...fabric, stock: normalizeFabricQuantity(Math.max((Number(fabric.stock) || 0) - stockByFabricLot[fabric.lot], 0)), unit: "公尺" }
                : fabric
            ))
          );
          setOrders((current) => current.filter((item) => item.id !== order.id));
          setShipments((current) => (
            current.some((shipment) => shipment.source === order.id)
              ? current
              : [createShipmentFromOrder(order, productMap), ...current]
          ));
          setActiveFlow("shipments");
          console.log("訂單已完成，轉為出貨單並扣庫存：", order);
          return true;
        };

        const shipOrderItems = (orderId, shipmentItems, orderDraftPatch = null) => {
          const storedOrder = orders.find((item) => item.id === orderId);
          const order = orderDraftPatch ? mergeOrderWithDraft(storedOrder, orderDraftPatch) : storedOrder;
          if (!order) return false;

          const selectedItems = shipmentItems.filter((item) => item.selected && (Number(item.shipQuantity) || 0) > 0);
          if (selectedItems.length === 0) {
            alert("請至少選取一項商品與出貨數量。正確格式：商品需勾選，出貨數量需為大於 0 且不超過未出貨數量的數字。");
            return false;
          }

          const inventoryItems = selectedItems.map((item) => ({
            ...item,
            product: productMap[item.productId],
            fabricLot: getFabricLotsForProduct(fabrics, productMap[item.productId]).find((fabric) => fabric.lot === item.batchNo),
            qty: isFabricProduct(productMap[item.productId]) ? normalizeFabricQuantity(item.shipQuantity) : Number(item.shipQuantity) || 0,
          }));
          const hasInvalidProduct = inventoryItems.some((item) => !item.product);
          const hasMissingFabricBatch = inventoryItems.some((item) => isFabricProduct(item.product) && (!item.batchNo || !item.fabricLot));
          const hasInsufficientStock = inventoryItems.some((item) => (
            isFabricProduct(item.product)
              ? normalizeFabricQuantity(item.fabricLot?.stock) < item.qty
              : item.product.stock < item.qty
          ));

          if (hasInvalidProduct || hasMissingFabricBatch || hasInsufficientStock) {
            console.log("庫存不足或商品尚未建立主檔，不能出貨：", selectedItems);
            alert("目前有商品庫存不足、布料批號未填，或商品尚未建立主檔，請先確認資料。");
            return false;
          }

          const stockByProductId = inventoryItems.reduce((map, item) => {
            map[item.productId] = (map[item.productId] || 0) + item.qty;
            return map;
          }, {});

          const stockByFabricLot = inventoryItems.reduce((map, item) => {
            if (isFabricProduct(item.product)) {
              map[item.batchNo] = (map[item.batchNo] || 0) + item.qty;
            }
            return map;
          }, {});

          const nextItems = (order.items || []).map((orderItem) => {
            const shippedItem = selectedItems.find((selected) => selected.id === orderItem.id);
            if (!shippedItem) return orderItem;
            const orderedQty = Number(orderItem.quantity) || 0;
            const currentShippedQty = Number(orderItem.shippedQuantity) || 0;
            const product = productMap[orderItem.productId];
            const nextShippedQty = Math.min(
              orderedQty,
              currentShippedQty + (isFabricProduct(product) ? normalizeFabricQuantity(shippedItem.shipQuantity) : Number(shippedItem.shipQuantity) || 0)
            );
            return { ...orderItem, shippedQuantity: String(nextShippedQty) };
          });
          const updatedOrder = {
            ...order,
            items: nextItems,
          };
          updatedOrder.status = getOrderStatus(updatedOrder);

          setProducts((current) =>
            current.map((product) => (
              stockByProductId[product.id]
                ? {
                    ...product,
                    stock: isFabricProduct(product)
                      ? normalizeFabricQuantity((Number(product.stock) || 0) - stockByProductId[product.id])
                      : product.stock - stockByProductId[product.id],
                  }
                : product
            ))
          );

          setFabrics((current) =>
            current.map((fabric) => (
              stockByFabricLot[fabric.lot]
                ? { ...fabric, stock: normalizeFabricQuantity(Math.max((Number(fabric.stock) || 0) - stockByFabricLot[fabric.lot], 0)), unit: "公尺" }
                : fabric
            ))
          );

          setOrders((current) =>
            current.flatMap((item) => {
              if (item.id !== orderId) return [item];
              return canTransferOrderToShipment(updatedOrder) ? [] : [updatedOrder];
            })
          );

          if (updatedOrder && canTransferOrderToShipment(updatedOrder)) {
            setShipments((current) => (
              current.some((shipment) => shipment.source === updatedOrder.id)
                ? current
                : [createShipmentFromOrder(updatedOrder, productMap), ...current]
            ));
          }
          console.log("訂單商品已出貨並扣庫存：", { order, selectedItems });
          return true;
        };

        const receivePurchase = (purchaseId) => {
          const purchase = purchases.find((item) => item.id === purchaseId);
          if (!purchase) return;

          const today = getLocalDateString();
          const purchaseItems = (purchase.items && purchase.items.length)
            ? purchase.items
            : [{
                id: `${purchase.id}-item-1`,
                productId: purchase.productId,
                productName: purchase.productName,
                qty: purchase.qty,
                amount: purchase.amount,
              }];
          const receiptDateInput = window.prompt("請輸入本次收貨日期（YYYY-MM-DD）。", today);
          if (receiptDateInput === null) return;
          const receiptDate = receiptDateInput.trim() || today;
          let workingFabrics = fabrics;
          const receiptRows = [];
          const productQtyMap = {};

          for (const [index, purchaseItem] of purchaseItems.entries()) {
            const product = productMap[purchaseItem.productId];
            if (!product) {
              alert(`第 ${index + 1} 筆商品尚未建立主檔，請先確認採購單資料。`);
              return;
            }

            let receivedQty = isFabricProduct(product)
              ? normalizeFabricQuantity(purchaseItem.qty)
              : Number(purchaseItem.qty) || 0;
            const qtyInput = window.prompt(
              `請輸入「${product.name}」本次收到數量${isFabricProduct(product) ? "（公尺，可到小數點後 1 位）" : "（件）"}。`,
              String(receivedQty)
            );
            if (qtyInput === null) return;
            receivedQty = isFabricProduct(product) ? normalizeFabricQuantity(qtyInput) : Number(qtyInput) || 0;
            if (!receivedQty || receivedQty <= 0) {
              alert(`請輸入「${product.name}」正確的收貨數量。正確格式：${isFabricProduct(product) ? "公尺數需大於 0，可到小數點後 1 位" : "件數需為大於 0 的整數"}。`);
              return;
            }

            let fabricAllocation = null;
            if (isFabricProduct(product)) {
              const existingBatchIds = getExistingFabricBatchIdsByDate(receiptDate, workingFabrics);
              const selectedBatch = existingBatchIds.length > 0
                ? window.prompt(
                    `「${product.name}」同日已有布料批號：${existingBatchIds.join("、")}\n若本次布料屬於同一次進貨，請輸入要併入的批號；留空則建立新的批號。`,
                    existingBatchIds[existingBatchIds.length - 1]
                  )
                : "";
              if (selectedBatch === null) return;
              const shouldUseExistingBatch = selectedBatch.trim() && existingBatchIds.includes(selectedBatch.trim());
              fabricAllocation = shouldUseExistingBatch
                ? { batchId: selectedBatch.trim(), renames: {} }
                : allocateFabricBatch(receiptDate, workingFabrics);
              workingFabrics = [
                {
                  id: product.sku,
                  productId: product.id,
                  name: product.name,
                  lot: fabricAllocation.batchId,
                  receivedDate: receiptDate,
                  material: product.specification || product.material || "",
                  color: product.color || "",
                  stock: receivedQty,
                  safetyStock: 10,
                  unit: "公尺",
                },
                ...workingFabrics.map((fabric) => (
                  fabricAllocation.renames[fabric.lot]
                    ? { ...fabric, lot: fabricAllocation.renames[fabric.lot] }
                    : fabric
                )),
              ];
            }

            productQtyMap[product.id] = (productQtyMap[product.id] || 0) + receivedQty;
            receiptRows.push({
              id: `GR-${Date.now().toString().slice(-6)}-${String(index + 1).padStart(2, "0")}`,
              relationType: "purchase_to_receipt",
              relationRule: stockFlowRelationRules.procurement.targetDoc,
              source: purchase.id,
              sourcePurchaseIds: [purchase.id],
              sourcePurchaseItemIds: [purchaseItem.id].filter(Boolean),
              vendor: purchase.vendor,
              productName: product.name,
              productId: product.id,
              qty: receivedQty,
              batchNo: fabricAllocation?.batchId || "",
              date: receiptDate,
              type: isFabricProduct(product) ? "布料進貨" : "採購轉進貨",
            });
          }

          setProducts((current) =>
            current.map((item) =>
              productQtyMap[item.id]
                ? {
                    ...item,
                    stock: isFabricProduct(item)
                      ? normalizeFabricQuantity((Number(item.stock) || 0) + productQtyMap[item.id])
                      : (Number(item.stock) || 0) + productQtyMap[item.id],
                  }
                : item
            )
          );
          setFabrics(workingFabrics);
          setPurchases((current) => current.filter((item) => item.id !== purchaseId));
          setReceipts((current) => [...receiptRows, ...current]);
          setActiveFlow("receipts");
          console.log("採購單已收貨，轉為進貨單並增加庫存：", { purchase, receiptRows });
        };

        const updateOrderDraft = (field, value) => {
          setOrderDraft((current) => ({ ...current, [field]: value }));
        };

        const saveOrderDraft = () => {
          const validItems = orderDraft.items.filter((item) => item.productId || item.productName || item.productKeyword);
          const firstItem = validItems[0];
          const selectedProduct = products.find((product) => product.id === firstItem?.productId);
          const selectedCustomer = customers.find((customer) => customer.id === orderDraft.customerId);
          const validationErrors = validateOrderDraft(orderDraft, productMap, fabrics);

          if (validationErrors.length > 0) {
            alert(`請完成以下必填欄位：\n${validationErrors.join("\n")}`);
            return;
          }

          const nextOrder = {
            id: orderDraft.orderNo.trim(),
            orderNo: orderDraft.orderNo.trim(),
            orderDate: orderDraft.orderDate,
            shippingCompletedDate: orderDraft.shippingCompletedDate,
            paymentCompletedDate: orderDraft.paymentCompletedDate,
            customer: selectedCustomer?.name || orderDraft.customerKeyword || "未命名客戶",
            customerId: orderDraft.customerId,
            customerKeyword: orderDraft.customerKeyword,
            productId: selectedProduct?.id || "",
            productName: selectedProduct?.name || firstItem.productName || firstItem.productKeyword || "自訂商品",
            items: validItems,
            qty: getDraftTotalQuantity(orderDraft),
            amount: calculateDraftTotal(orderDraft),
            shippingMethod: orderDraft.shippingMethod,
            recipientName: orderDraft.recipientName,
            recipientAddress: orderDraft.recipientAddress,
            shipmentNo: getShipmentNoForMethod(orderDraft.shippingMethod, orderDraft.shipmentNo).trim(),
            orderType: orderDraft.orderType,
            needsPinkoiReview: orderDraft.orderType === "零售-PINKOI" ? Boolean(orderDraft.needsPinkoiReview) : false,
            shippingFee: Number(orderDraft.shippingFee) || 0,
            discountAmount: Number(orderDraft.discountAmount) || 0,
            invoiceMethod: orderDraft.invoiceMethod,
            invoiceCopy: orderDraft.invoiceCopy,
            invoiceNumber: orderDraft.invoiceNumber.trim(),
            paymentStatus: orderDraft.paymentStatus,
            receivedAmount: getReceivedAmount(orderDraft),
            outstandingAmount: getOutstandingAmount(orderDraft),
            paid: orderDraft.paymentStatus === "已付款",
            shipped: false,
            status: getOrderStatus({ items: validItems }),
          };

          setOrders((current) => [nextOrder, ...current]);
          setOrderDraft(createEmptyOrderDraft());
          setActiveView("flow");
          setActiveFlow("orders");
          console.log("新建訂單已加入未完成訂單列表，不扣庫存：", nextOrder);
        };

        if (!currentUser) {
          return <LoginPage users={users} onLogin={login} />;
        }

        return (
          <main className="min-h-screen bg-[#DDE3D5] px-5 py-6 text-neutral-900 sm:px-8 sm:py-10">
            <div className="mx-auto max-w-7xl">
              <nav className="overflow-x-auto rounded-lg border border-neutral-200 bg-[#D6DEC9] p-1 shadow-sm">
                <div className="flex min-w-max items-center">
                  <NavButton active={activeView === "home"} onClick={() => setActiveView("home")}>
                    首頁
                  </NavButton>
                  <NavButton active={activeView === "flow" || activeView === "newOrder"} onClick={() => setActiveView("flow")}>
                    進/出貨作業
                  </NavButton>
                  <NavButton active={activeView === "affairs"} onClick={() => setActiveView("affairs")}>
                    事務
                  </NavButton>
                  <NavButton active={activeView === "database" || activeView === "newProduct"} onClick={() => setActiveView("database")}>
                    基本資料
                  </NavButton>
                  <NavButton active={activeView === "importExport"} onClick={() => setActiveView("importExport")}>
                    匯入/匯出
                  </NavButton>
                  <div className="ml-auto flex items-center gap-3 px-3">
                    <span className="text-sm text-neutral-600">{currentUser.id} {currentUser.name}</span>
                    <button
                      type="button"
                      onClick={logout}
                      className="h-9 rounded-md border border-neutral-300 bg-white px-3 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950"
                    >
                      登出
                    </button>
                  </div>
                </div>
              </nav>

              {secondaryNavigation.items.length > 0 && (
                <SecondaryNavigation
                  items={secondaryNavigation.items}
                  activeId={secondaryNavigation.activeId}
                  onSelect={secondaryNavigation.onSelect}
                />
              )}

              {activeView === "dashboard" && (
                <MetricCardsPanel metrics={metrics} />
              )}

              {activeView === "home" && (
                <HomeDashboard
                  orders={orders}
                  purchases={purchases}
                  consignmentDocs={consignmentDocs}
                  productMap={productMap}
                  metrics={metrics}
                  activeHome={activeHome}
                  calendarEvents={calendarShifts}
                  setCalendarEvents={setHomeCalendarEvents}
                  setActiveView={setActiveView}
                  setActiveFlow={setActiveFlow}
                  completeOrder={transferOrderToShipment}
                  receivePurchase={receivePurchase}
                />
              )}

              {activeView === "importExport" && (
                <ImportExportWorkspace
                  products={products}
                  customers={customers}
                  orders={orders}
                  users={users}
                  partners={partners}
                  warehouses={warehouseRecords}
                  batches={visibleBatches}
                />
              )}

              {activeView === "dashboard" && (
                activeInventory === "products" ? (
                  <InventoryDashboard
                    filteredProducts={filteredProducts}
                    searchKeyword={searchKeyword}
                    setSearchKeyword={setSearchKeyword}
                    stockFilter={stockFilter}
                    setStockFilter={setStockFilter}
                  />
                ) : (
                  <FabricInventoryDashboard
                    fabrics={filteredFabrics}
                    searchKeyword={searchKeyword}
                    setSearchKeyword={setSearchKeyword}
                    stockFilter={stockFilter}
                    setStockFilter={setStockFilter}
                  />
                )
              )}

              {activeView === "flow" && (
                <StockFlowWorkspace
                  activeFlow={activeFlow}
                  setActiveFlow={setActiveFlow}
                  setActiveView={setActiveView}
                  orders={orders}
                  setOrders={setOrders}
                  shipments={shipments}
                  purchases={purchases}
                  setPurchases={setPurchases}
                  receipts={receipts}
                  setReceipts={setReceipts}
                  consignmentDocs={consignmentDocs}
                  setConsignmentDocs={setConsignmentDocs}
                  filteredProducts={filteredProducts}
                  filteredFabrics={filteredFabrics}
                  products={products}
                  fabrics={fabrics}
                  setProducts={setProducts}
                  setFabrics={setFabrics}
                  stocktakeRecords={stocktakeRecords}
                  setStocktakeRecords={setStocktakeRecords}
                  searchKeyword={searchKeyword}
                  setSearchKeyword={setSearchKeyword}
                  stockFilter={stockFilter}
                  setStockFilter={setStockFilter}
                  productMap={productMap}
                  transferOrderToShipment={transferOrderToShipment}
                  shipOrderItems={shipOrderItems}
                  receivePurchase={receivePurchase}
                />
              )}

              {activeView === "database" && (
                <DatabaseWorkspace
                  activeDatabase={activeDatabase}
                  setActiveDatabase={setActiveDatabase}
                  customers={customers}
                  setCustomers={setCustomers}
                  users={users}
                  setUsers={setUsers}
                  categoryRecords={categoryRecords}
                  setCategoryRecords={setCategoryRecords}
                  vendors={vendorRecords}
                  tailors={tailorRecords}
                  consignmentBrands={consignmentBrandRecords}
                  consignmentPoints={consignmentPointRecords}
                  batches={visibleBatches}
                  warehouses={warehouseRecords}
                  partners={partners}
                  setPartners={setPartners}
                  products={products}
                  setProducts={setProducts}
                  currentUser={currentUser}
                  setActiveView={setActiveView}
                />
              )}

              {activeView === "newProduct" && (
                <NewProductPage
                  draft={productDraft}
                  setDraft={setProductDraft}
                  products={products}
                  vendors={vendorRecords}
                  onBack={() => setActiveView("database")}
                  onSave={(product) => {
                    setProducts((current) => [product, ...current]);
                    setProductDraft(createEmptyProductDraft());
                    setActiveDatabase("products");
                    setActiveView("database");
                  }}
                />
              )}

              {activeView === "affairs" && (
                <AffairsWorkspace
                  activeAffairs={activeAffairs}
                  pettyCashRecords={pettyCashRecords}
                  labelPrintJobs={labelPrintJobs}
                  calendarShifts={calendarShifts}
                  assignedTaskRecords={assignedTaskRecords}
                  currentUserName={currentUser?.name || users[0]?.name || "又平"}
                />
              )}

              {activeView === "newOrder" && (
                <NewOrderPage
                  draft={orderDraft}
                  updateDraft={updateOrderDraft}
                  products={products}
                  fabrics={fabrics}
                  customers={customers}
                  setCustomers={setCustomers}
                  onBack={() => {
                    setActiveView("flow");
                    setActiveFlow("orders");
                  }}

                onDragStart={(event) => {

                }}
                onDragOver={(event) => {
                  event.preventDefault();
                  event.dataTransfer.dropEffect = "move";

                  event.preventDefault();

      function parsePastedTable(text, fields) {
        const lines = text
          .trim()
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);
        if (lines.length < 2) return [];

        const delimiter = lines[0].includes("\t") ? "\t" : ",";
        const headers = splitTableLine(lines[0], delimiter).map((header) => header.trim());
        const labels = getImportExportFieldLabels();
        const fieldByHeader = fields.reduce((map, field) => {
          map[field] = field;
          map[labels[field] || field] = field;
          return map;
        }, {});
        const mappedFields = headers.map((header, index) => fieldByHeader[header] || fields[index] || header);

        return lines.slice(1).map((line) => {
          const cells = splitTableLine(line, delimiter);
          return mappedFields.reduce((row, field, index) => {
            if (fields.includes(field)) row[field] = cells[index]?.trim() || "";
            return row;
          }, {});
        });
      }

      function splitTableLine(line, delimiter) {
        if (delimiter === "\t") return line.split("\t");
        const result = [];
        let current = "";
        let inQuotes = false;
        for (let index = 0; index < line.length; index += 1) {
          const char = line[index];
          const nextChar = line[index + 1];
          if (char === '"' && nextChar === '"') {
            current += '"';
            index += 1;
          } else if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === "," && !inQuotes) {
            result.push(current);
            current = "";
          } else {
            current += char;
          }
        }
        result.push(current);
        return result;
      }

      function downloadExcelFile({ filename, sheetName, fields, rows, labels }) {
        const escapeHtml = (value) =>
          String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
        const tableRows = [
          `<tr>${fields.map((field) => `<th>${escapeHtml(labels[field] || field)}</th>`).join("")}</tr>`,
          ...rows.map((row) => `<tr>${fields.map((field) => `<td>${escapeHtml(row[field])}</td>`).join("")}</tr>`),
        ].join("");
        const workbook = `
          <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
            <head><meta charset="UTF-8" /></head>
            <body><table>${tableRows}</table></body>
          </html>
        `;
        const blob = new Blob([workbook], { type: "application/vnd.ms-excel;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        console.log(`已產生 ${sheetName}：`, { filename, rows });
      }

      function getLocalDateString(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function toFabricBatchBase(dateString) {
        const date = dateString ? new Date(`${dateString}T00:00:00`) : new Date();
        if (Number.isNaN(date.getTime())) return toFabricBatchBase(getLocalDateString());
        return `${String(date.getFullYear()).slice(-2)}${String(date.getMonth() + 1).padStart(2, "0")}${String(date.getDate()).padStart(2, "0")}`;
      }

      function getFabricLotProductId(fabric) {
        return fabric.productId || fabric.productCode || fabric.id;
      }

      function isFabricProduct(product) {
        if (!product) return false;
        return product.nature === "布料" || product.categoryCode === "F" || String(product.sku || "").startsWith("F-");
      }

      function getFabricLotsForProduct(fabrics, product) {
        if (!product) return [];
        return fabrics.filter((fabric) =>
          String(getFabricLotProductId(fabric)) === String(product.id) ||
          String(fabric.id) === String(product.sku)
        );
      }

      function buildBatchRowsFromFabrics(fabrics, batches = []) {
        const nonFabricBatches = batches.filter((batch) => batch.type !== "布料" && !batch.fabricManaged);
        const fabricBatchMap = fabrics.reduce((map, fabric) => {
          const lot = String(fabric.lot || "").trim();
          if (!lot) return map;
          const current = map[lot] || {
            id: lot,
            type: "布料",
            fabricManaged: true,
            productName: "",
            fabricCount: 0,
            qty: 0,
            receivedDate: fabric.receivedDate || "",
            status: "已用完",
            items: [],
          };
          const stock = normalizeFabricQuantity(fabric.stock);
          current.qty += stock;
          current.receivedDate = current.receivedDate || fabric.receivedDate || "";
          current.items.push({
            productId: getFabricLotProductId(fabric),
            productCode: fabric.id,
            productName: fabric.name,
            material: fabric.material,
            color: fabric.color,
            qty: stock,
            unit: "公尺",
          });
          current.fabricCount = current.items.length;
          current.productName = current.items.map((item) => item.productName).join("、");
          current.status = current.qty > 0 ? "可用" : "已用完";
          map[lot] = current;
          return map;
        }, {});
        return [...Object.values(fabricBatchMap), ...nonFabricBatches];
      }

      function allocateFabricBatch(receivedDate, currentFabrics) {
        const base = toFabricBatchBase(receivedDate);
        const sameDayLots = currentFabrics
          .map((fabric) => fabric.lot)
          .filter((lot) => String(lot || "").startsWith(base));
        if (sameDayLots.length === 0) {
          return { batchId: base, renames: {} };
        }

        const renames = {};
        let normalizedLots = sameDayLots;
        if (sameDayLots.includes(base)) {
          renames[base] = `${base}A`;
          normalizedLots = sameDayLots.map((lot) => (lot === base ? `${base}A` : lot));
        }

        const usedLetters = normalizedLots
          .map((lot) => String(lot).slice(base.length))
          .filter(Boolean);
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const nextLetter = letters.split("").find((letter) => !usedLetters.includes(letter)) || String(usedLetters.length + 1);
        return { batchId: `${base}${nextLetter}`, renames };
      }

      function getExistingFabricBatchIdsByDate(receivedDate, currentFabrics) {
        const base = toFabricBatchBase(receivedDate);
        return Array.from(new Set(
          currentFabrics
            .map((fabric) => fabric.lot)
            .filter((lot) => String(lot || "").startsWith(base))
        )).sort((a, b) => String(a).localeCompare(String(b), "zh-Hant"));
      }

      function normalizeFabricQuantity(value) {
        return Math.round((Number(value) || 0) * 10) / 10;
      }

      function formatFabricQuantity(value) {
        return normalizeFabricQuantity(value).toFixed(1);
      }

      function getBatchLabel(batchId) {
        return batchId || "未指定批號";
      }

      function getOrderItemUnit(item, productMap = {}) {
        return isFabricProduct(productMap[item.productId]) || item.batchNo ? "公尺" : "件";
      }

      function formatOrderItemQuantity(item, value, productMap = {}) {
        return getOrderItemUnit(item, productMap) === "公尺"
          ? formatFabricQuantity(value)
          : String(Number(value) || 0);
      }

      function getPreorderItemSummary(orders, productMap) {
        const preorderMap = {};

        orders.forEach((order) => {
          (order.items || []).forEach((item) => {
            if (!item.isPreorder) return;
            const product = productMap[item.productId];
            const key = item.productId || item.productKeyword || item.productName || `${order.id}-${item.id}`;
            const name = product?.name || item.productName || item.productKeyword || "自訂商品";
            const sku = product?.sku || item.productKeyword || "";
            const unit = getOrderItemUnit(item, productMap);
            const quantity = Number(item.quantity) || 0;

            if (!preorderMap[key]) {
              preorderMap[key] = {
                key,
                name,
                sku,
                unit,
                quantity: 0,
                orderIds: [],
              };
            }

            preorderMap[key].quantity += unit === "公尺" ? normalizeFabricQuantity(quantity) : quantity;
            if (!preorderMap[key].orderIds.includes(order.id)) {
              preorderMap[key].orderIds.push(order.id);
            }
          });
        });

        return Object.values(preorderMap).sort((a, b) => b.quantity - a.quantity || a.name.localeCompare(b.name, "zh-Hant"));
      }

      function MetricCardsPanel({ metrics }) {
        const [layout, setLayout] = useState(loadMetricCardLayout);
        const cardDefinitions = {
          totalProducts: { label: "總商品品項數", value: metrics.totalProducts, helper: "目前管理中的商品種類" },
          totalStock: { label: "總庫存量", value: metrics.totalStock, helper: "所有商品目前庫存合計" },
          lowStock: { label: "低庫存警示", value: metrics.lowStock, helper: "庫存少於 10 件的商品", warning: true },
          pendingOrders: { label: "未完成訂單", value: metrics.pendingOrders, helper: "未轉為出貨單的訂單" },
          pendingPurchases: { label: "待收採購", value: metrics.pendingPurchases, helper: "未轉為進貨單的採購單" },
        };
        const visibleCards = layout.order.filter((id) => !layout.hidden.includes(id));
        const hiddenCards = layout.order.filter((id) => layout.hidden.includes(id));

        useEffect(() => {
          try {
            window.localStorage.setItem(metricCardStorageKey, JSON.stringify(layout));
          } catch (error) {
            console.warn("儲存首頁指標卡設定失敗。", error);
          }
        }, [layout]);

        const moveCard = (cardId, direction) => {
          setLayout((current) => {
            const index = current.order.indexOf(cardId);
            const targetIndex = index + direction;
            if (index < 0 || targetIndex < 0 || targetIndex >= current.order.length) return current;
            const nextOrder = [...current.order];
            [nextOrder[index], nextOrder[targetIndex]] = [nextOrder[targetIndex], nextOrder[index]];
            return { ...current, order: nextOrder };
          });
        };

        const hideCard = (cardId) => {
          setLayout((current) => ({
            ...current,
            hidden: current.hidden.includes(cardId) ? current.hidden : [...current.hidden, cardId],
          }));
        };

        const showCard = (cardId) => {
          setLayout((current) => ({
            ...current,
            hidden: current.hidden.filter((id) => id !== cardId),
          }));
        };

        return (
          <section className="mb-7 mt-7 space-y-3">
            {hiddenCards.length > 0 && (
              <div className="flex flex-col gap-2 rounded-lg border border-neutral-200 bg-[#D6DEC9] px-4 py-3 shadow-sm sm:flex-row sm:items-center sm:justify-between">
                <span className="text-sm font-medium text-neutral-700">已隱藏區塊</span>
                <div className="flex flex-wrap gap-2">
                  {hiddenCards.map((cardId) => (
                    <button
                      key={cardId}
                      type="button"
                      onClick={() => showCard(cardId)}
                      className="h-8 rounded-md border border-neutral-300 px-3 text-xs font-medium text-neutral-700 transition hover:border-neutral-950"
                    >
                      顯示 {cardDefinitions[cardId].label}
                    </button>
                  ))}
                </div>
              </div>
            )}

            <div className="grid gap-4 md:grid-cols-3 xl:grid-cols-5">
              {visibleCards.map((cardId, index) => {
                const card = cardDefinitions[cardId];
                return (
                  <div key={cardId} className="space-y-2">
                    <div className="flex justify-end gap-1">
                      <button
                        type="button"
                        onClick={() => moveCard(cardId, -1)}
                        disabled={index === 0}
                        className="h-7 rounded-md border border-neutral-300 bg-white px-2 text-xs font-medium text-neutral-600 transition hover:border-neutral-950 disabled:cursor-not-allowed disabled:opacity-40"
                      >
                        上移
                      </button>
                      <button
                        type="button"
                        onClick={() => moveCard(cardId, 1)}
                        disabled={index === visibleCards.length - 1}
                        className="h-7 rounded-md border border-neutral-300 bg-white px-2 text-xs font-medium text-neutral-600 transition hover:border-neutral-950 disabled:cursor-not-allowed disabled:opacity-40"
                      >
                        下移
                      </button>
                      <button
                        type="button"
                        onClick={() => hideCard(cardId)}
                        className="h-7 rounded-md border border-neutral-300 bg-white px-2 text-xs font-medium text-neutral-600 transition hover:border-neutral-950"
                      >
                        隱藏
                      </button>
                    </div>
                    <DashboardCard {...card} />
                  </div>
                );
              })}
            </div>
          </section>
        );
      }

      function FormField({ label, children }) {
        return (

      function getFieldLabel(field) {
        const labelledBy = field.getAttribute("aria-label") || field.getAttribute("placeholder");
        if (labelledBy) return labelledBy;
        const label = field.closest("label");
        const labelText = label?.querySelector("span")?.textContent || label?.textContent;
        return (labelText || "此欄位").replace(/\s+/g, " ").trim();
      }

      function getFieldFormatHint(field) {
        if (field.dataset.format) return field.dataset.format;
        if (field instanceof HTMLSelectElement) return "請從下拉選單選擇一個項目。";
        if (field.type === "date") return "日期格式為 YYYY-MM-DD。";
        if (field.type === "email") return "請輸入有效 E-mail，例如 name@example.com。";
        if (field.type === "number") {
          const min = field.getAttribute("min");
          const step = field.getAttribute("step");
          if (step === "1") return `請輸入整數${min ? `，不可小於 ${min}` : ""}。`;
          if (step === "0.1") return `請輸入數字，可到小數點後 1 位${min ? `，不可小於 ${min}` : ""}。`;
          return "請輸入有效數字。";
        }
        if (field.pattern === "[A-Za-z0-9]+") return "帳號僅可輸入英文字母與數字。";
        if (field.pattern === "[0-9]{6}" || field.pattern === "\\d{6}" || field.pattern === "\\\\d{6}") return "密碼須為 6 位數字，例如 000000。";
        return "請輸入文字或依欄位要求填寫正確資料。";
      }

      function handleInvalidField(event) {
        const field = event.target;
        if (!(field instanceof HTMLInputElement || field instanceof HTMLSelectElement || field instanceof HTMLTextAreaElement)) return;
        const label = getFieldLabel(field);
        const hint = getFieldFormatHint(field);
        if (field.validity.valueMissing) {
          field.setCustomValidity(`請填寫「${label}」。正確格式：${hint}`);
        } else {
          field.setCustomValidity(`「${label}」格式不正確。正確格式：${hint}`);
        }
      }

      function clearFieldValidity(event) {
        const field = event.target;
        if (field instanceof HTMLInputElement || field instanceof HTMLSelectElement || field instanceof HTMLTextAreaElement) {
          field.setCustomValidity("");
        }
      }

          <section className="mt-7 rounded-lg border border-neutral-200 bg-[#D6DEC9] shadow-sm">
            <div className="border-b border-neutral-200 px-5 py-4">
              <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
                <div>
                  <h2 className="text-lg font-semibold text-neutral-950">進/出貨作業</h2>
                </div>
                {props.activeFlow !== "shipments" && (
                  <button
                    className="h-10 rounded-md bg-neutral-950 px-4 text-sm font-medium text-white transition hover:bg-neutral-700"
                    onClick={createNewDocument}
                  >
                    新增{activeFlowLabel === "庫存管理" ? "庫存調整" : "單據"}
                  </button>
                )}
              </div>
            </div>

            <div className="grid gap-0 lg:grid-cols-1">
              <div className="p-5">
                {props.activeFlow === "inventory" && (
                  <InventoryManagementPanel
                    inventoryMode={inventoryMode}
                    setInventoryMode={setInventoryMode}
                    filteredProducts={props.filteredProducts}
                    filteredFabrics={props.filteredFabrics}
                    products={props.products}
                    fabrics={props.fabrics}
                    setProducts={props.setProducts}
                    setFabrics={props.setFabrics}
                    stocktakeRecords={props.stocktakeRecords}
                    setStocktakeRecords={props.setStocktakeRecords}
                    searchKeyword={props.searchKeyword}
                    setSearchKeyword={props.setSearchKeyword}
                    stockFilter={props.stockFilter}
                    setStockFilter={props.setStockFilter}
                  />
                )}
                {props.activeFlow === "orders" && (
                  <OrdersPanel
                    orders={props.orders}
                    productMap={props.productMap}
                    fabrics={props.fabrics}
                    onUpdate={(updatedOrder) =>
                      props.setOrders((current) => current.map((order) => (order.id === updatedOrder.id ? updatedOrder : order)))
                    }
                    onDelete={(order) =>
                      props.setOrders((current) => current.filter((item) => item.id !== order.id))
                    }
                    onCancel={(order) =>
                      props.setOrders((current) => current.filter((item) => item.id !== order.id))

                    onTransferToShipment={props.transferOrderToShipment}

                {props.activeFlow === "shipments" && <ShipmentsPanel shipments={props.shipments} />}
                {props.activeFlow === "purchases" && <PurchasesPanel purchases={props.purchases} productMap={props.productMap} onReceive={props.receivePurchase} />}
                {props.activeFlow === "receipts" && <SimpleDocTable title="進貨單" docs={props.receipts} columns={["id", "source", "vendor", "productName", "batchNo", "qty", "date", "type"]} />}
                {props.activeFlow === "consignment" && <SimpleDocTable title="寄售/快閃" docs={props.consignmentDocs} columns={["id", "location", "productName", "qty", "status"]} />}
              </div>
            </div>
          </section>
        );

      function InventoryManagementPanel({
        inventoryMode,
        setInventoryMode,
        filteredProducts,
        filteredFabrics,
        products,
        fabrics,
        setProducts,
        setFabrics,
        stocktakeRecords,
        setStocktakeRecords,
        searchKeyword,
        setSearchKeyword,
        stockFilter,
        setStockFilter,
      }) {
        return (
          <div>
            <div className="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <h3 className="text-base font-semibold text-neutral-950">庫存管理</h3>
              </div>
              <div className="inline-flex rounded-lg border border-neutral-200 bg-neutral-100 p-1">
                {[
                  { id: "products", label: "商品庫存", count: filteredProducts.length },
                  { id: "fabrics", label: "布料庫存", count: filteredFabrics.length },
                  { id: "stocktake", label: "盤點", count: stocktakeRecords.length },
                ].map((item) => (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => setInventoryMode(item.id)}
                    className={`h-9 rounded-md px-3 text-sm font-medium transition ${
                      inventoryMode === item.id ? "bg-white text-neutral-950 shadow-sm" : "text-neutral-500 hover:text-neutral-900"

                  >
                    {item.label}（{item.count}）
                  </button>
                ))}

            </div>

            {inventoryMode === "products" ? (
              <InventoryDashboard
                filteredProducts={filteredProducts}
                searchKeyword={searchKeyword}
                setSearchKeyword={setSearchKeyword}
                stockFilter={stockFilter}
                setStockFilter={setStockFilter}
              />
            ) : inventoryMode === "fabrics" ? (
              <FabricInventoryDashboard
                fabrics={filteredFabrics}
                searchKeyword={searchKeyword}
                setSearchKeyword={setSearchKeyword}
                stockFilter={stockFilter}
                setStockFilter={setStockFilter}
              />
            ) : (
              <StocktakePanel
                products={products}
                fabrics={fabrics}
                setProducts={setProducts}
                setFabrics={setFabrics}
                records={stocktakeRecords}
                setRecords={setStocktakeRecords}
              />
            )}
          </div>
        );
      }

      function ProductSelectField({ products, value, onChange, required = true }) {
        return (
          <select required={required} value={value} onChange={(event) => onChange(event.target.value)} className={inputClass}>
            <option value="">選擇商品</option>
            {products.map((product) => (
              <option key={product.id} value={product.id}>
                {product.sku} / {product.name}
              </option>
            ))}
          </select>
        );
      }

      function NewPurchasePage({ products, onBack, onSave }) {
        const [draft, setDraft] = useState(createEmptyPurchaseDraft);
        const updateDraft = (field, value) => setDraft((current) => ({ ...current, [field]: value }));
        const updateItem = (itemId, field, value) => {
          setDraft((current) => ({
            ...current,
            items: current.items.map((item) => (item.id === itemId ? { ...item, [field]: value } : item)),
          }));
        };
        const addItem = () => setDraft((current) => ({ ...current, items: [...current.items, createEmptyPurchaseItem()] }));
        const removeItem = (itemId) => {
          setDraft((current) => ({
            ...current,
            activeItemId: current.items[0]?.id || "",
            items: current.items.length > 1 ? current.items.filter((item) => item.id !== itemId) : current.items,
          }));
        };
        const getItemProduct = (item) => products.find((product) => String(product.id) === String(item.productId));
        const normalizedItems = draft.items
          .map((item) => {
            const product = getItemProduct(item);
            const qty = isFabricProduct(product) ? normalizeFabricQuantity(item.qty) : Number(item.qty) || 0;
            const unitCost = Number(item.unitCost) || 0;
            const amount = Number(item.amount) || qty * unitCost;
            return product && qty > 0
              ? {
                  ...item,
                  productId: product.id,
                  productName: product.name,
                  productSku: product.sku,
                  qty,
                  unitCost,
                  amount,
                  unit: isFabricProduct(product) ? "公尺" : "件",
                }
              : null;
          })
          .filter(Boolean);
        const totalQty = normalizedItems.reduce((sum, item) => sum + item.qty, 0);
        const totalAmount = normalizedItems.reduce((sum, item) => sum + item.amount, 0);

        const submit = (event) => {
          event.preventDefault();
          if (!draft.id.trim() || !draft.vendor.trim() || normalizedItems.length === 0) {
            alert("請填入採購單號、廠商，並至少建立一筆商品與數量。正確格式：採購單號與廠商為文字；商品需從下拉選單選擇；件數為整數，布料公尺數可到小數點後 1 位。");
            return;
          }
          const firstItem = normalizedItems[0];
          onSave({
            ...draft,
            productId: firstItem.productId,
            productName: firstItem.productName,
            qty: totalQty,
            amount: totalAmount || Number(draft.amount) || 0,
            items: normalizedItems,
            status: "待收貨",
          });
          console.log("新增採購單：", draft);
        };

        return (
          <section className="mt-7 rounded-lg border border-neutral-200 bg-[#D6DEC9] shadow-sm">
            <DocFormHeader title="新建採購單" helper="已向廠商叫貨後建立採購單；採購單成立時不會增加庫存。" onBack={onBack} submitLabel="建立採購單" />
            <form {...formValidationProps} id="flow-doc-form" onSubmit={submit} className="space-y-6 p-5">
              <OrderSection title="採購單資料" helper="到貨後依照實際收到的商品轉進貨單，可只處理本單部分品項。">
                <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
                  <FormField label="採購單號"><input required value={draft.id} onChange={(event) => updateDraft("id", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="採購日期"><input type="date" value={draft.orderDate} onChange={(event) => updateDraft("orderDate", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="預計到貨日"><input type="date" value={draft.expectedDate} onChange={(event) => updateDraft("expectedDate", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="廠商"><input required value={draft.vendor} onChange={(event) => updateDraft("vendor", event.target.value)} placeholder="輸入或貼上合作單位名稱" className={inputClass} /></FormField>
                  <FormField label="商品總數量"><input readOnly value={Number.isInteger(totalQty) ? totalQty : formatFabricQuantity(totalQty)} className={`${inputClass} bg-neutral-50 text-neutral-500`} /></FormField>
                  <FormField label="採購金額合計"><input readOnly value={formatCurrency(totalAmount)} className={`${inputClass} bg-neutral-50 text-neutral-500`} /></FormField>
                  <FormField label="備註"><input value={draft.note} onChange={(event) => updateDraft("note", event.target.value)} className={inputClass} /></FormField>
                </div>
              </OrderSection>
              <OrderSection title="採購單表身" helper="可輸入多筆商品；布料數量以公尺計算到小數點後 1 位。">
                <div className="overflow-x-auto rounded-lg border border-neutral-200">
                  <table className="w-full min-w-[920px] text-left">
                    <thead className="bg-neutral-50 text-xs uppercase tracking-wide text-neutral-500">
                      <tr>
                        {["商品", "單位", "數量", "單價", "小計", "備註", "操作"].map((heading) => (
                          <th key={heading} className="px-4 py-3 font-medium">{heading}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-neutral-100">
                      {draft.items.map((item) => {
                        const product = getItemProduct(item);
                        const unit = isFabricProduct(product) ? "公尺" : "件";
                        const qty = isFabricProduct(product) ? normalizeFabricQuantity(item.qty) : Number(item.qty) || 0;
                        const lineAmount = Number(item.amount) || qty * (Number(item.unitCost) || 0);
                        return (
                          <tr key={item.id} className={draft.activeItemId === item.id ? "bg-neutral-50" : "bg-white"}>
                            <td className="px-4 py-4"><ProductSelectField products={products} value={item.productId} onChange={(value) => updateItem(item.id, "productId", value)} /></td>
                            <td className="px-4 py-4 text-sm text-neutral-600">{product ? unit : "-"}</td>
                            <td className="px-4 py-4">
                              <input required type="number" min={unit === "公尺" ? "0.1" : "1"} step={unit === "公尺" ? "0.1" : "1"} value={item.qty} onFocus={() => updateDraft("activeItemId", item.id)} onChange={(event) => updateItem(item.id, "qty", event.target.value)} className={inputClass} />
                            </td>
                            <td className="px-4 py-4"><input type="number" min="0" value={item.unitCost} onChange={(event) => updateItem(item.id, "unitCost", event.target.value)} className={inputClass} /></td>
                            <td className="px-4 py-4"><input type="number" min="0" value={item.amount} onChange={(event) => updateItem(item.id, "amount", event.target.value)} placeholder={lineAmount ? String(lineAmount) : "自動計算"} className={inputClass} /></td>
                            <td className="px-4 py-4"><input value={item.note} onChange={(event) => updateItem(item.id, "note", event.target.value)} className={inputClass} /></td>
                            <td className="px-4 py-4 text-right">
                              <button type="button" onClick={() => removeItem(item.id)} className="h-9 rounded-md border border-neutral-300 bg-white px-3 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950">
                                刪除
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                <div className="mt-4 flex justify-end">
                  <button type="button" onClick={addItem} className="h-10 rounded-md border border-neutral-300 bg-white px-4 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950">
                    新增商品
                  </button>
                </div>
              </OrderSection>
            </form>
          </section>
        );
      }

      function NewReceiptPage({ products, productMap, fabrics, setProducts, setFabrics, onBack, onSave }) {
        const [draft, setDraft] = useState(createEmptyReceiptDraft);
        const selectedProduct = products.find((product) => String(product.id) === String(draft.productId));
        const isFabric = isFabricProduct(selectedProduct);
        const fabricLots = getFabricLotsForProduct(fabrics, selectedProduct);
        const proposedBatch = useMemo(() => allocateFabricBatch(draft.date, fabrics).batchId, [draft.date, fabrics]);
        const updateDraft = (field, value) => setDraft((current) => ({ ...current, [field]: value }));

        useEffect(() => {
          if (!isFabric) {
            updateDraft("batchNo", "");
            updateDraft("batchMode", "existing");
            return;
          }
          if (draft.batchMode === "existing" && !draft.batchNo && fabricLots[0]?.lot) {
            updateDraft("batchNo", fabricLots[0].lot);
          }
        }, [draft.productId, isFabric, fabricLots.length]);

        const submit = (event) => {
          event.preventDefault();
          if (!draft.id.trim() || !draft.vendor.trim() || !draft.productId || !Number(draft.qty)) {
            alert("請填入進貨單號、廠商、商品與數量。正確格式：進貨單號與廠商為文字；商品需從下拉選單選擇；件數為整數，布料公尺數可到小數點後 1 位。");
            return;
          }
          const qty = isFabric ? normalizeFabricQuantity(draft.qty) : Number(draft.qty);
          if (isFabric && qty <= 0) {
            alert("布料進貨數量需大於 0。正確格式：請輸入公尺數，可到小數點後 1 位，例如 3.5。");
            return;
          }
          const fabricAllocation = isFabric && draft.batchMode === "new" ? allocateFabricBatch(draft.date, fabrics) : null;
          const batchNo = isFabric ? (fabricAllocation ? fabricAllocation.batchId : draft.batchNo) : "";
          if (isFabric && !batchNo) {
            alert("布料進貨需指定批號。正確格式：請從批號下拉選單選擇既有批號，或輸入 YYMMDD / YYMMDD+A-Z 格式的新批號，例如 260826A。");
            return;
          }

          setProducts((current) =>
            current.map((product) =>
              product.id === selectedProduct.id
                ? { ...product, stock: isFabric ? normalizeFabricQuantity((Number(product.stock) || 0) + qty) : (Number(product.stock) || 0) + qty }
                : product
            )
          );

          if (isFabric) {
            setFabrics((current) => {
              const renamedFabrics = current.map((fabric) => (
                fabricAllocation?.renames?.[fabric.lot]
                  ? { ...fabric, lot: fabricAllocation.renames[fabric.lot] }
                  : fabric
              ));
              const hasExistingLot = renamedFabrics.some((fabric) => String(getFabricLotProductId(fabric)) === String(selectedProduct.id) && fabric.lot === batchNo);
              if (hasExistingLot) {
                return renamedFabrics.map((fabric) =>
                  String(getFabricLotProductId(fabric)) === String(selectedProduct.id) && fabric.lot === batchNo
                    ? { ...fabric, stock: normalizeFabricQuantity((Number(fabric.stock) || 0) + qty), unit: "公尺" }
                    : fabric
                );
              }
              return [
                {
                  id: selectedProduct.sku,
                  productId: selectedProduct.id,
                  name: selectedProduct.name,
                  lot: batchNo,
                  receivedDate: draft.date,
                  material: selectedProduct.specification || "",
                  color: selectedProduct.color || "",
                  stock: qty,
                  safetyStock: 10,
                  unit: "公尺",
                },
                ...renamedFabrics,
              ];
            });
          }

          onSave({
            id: draft.id,
            relationType: draft.source ? "purchase_to_receipt" : "direct_receipt",
            relationRule: stockFlowRelationRules.procurement.targetDoc,
            source: draft.source || "直接進貨",
            sourcePurchaseIds: draft.source ? [draft.source] : [],
            sourcePurchaseItemIds: [],
            vendor: draft.vendor,
            productName: selectedProduct.name,
            productId: selectedProduct.id,
            qty,
            batchNo,
            date: draft.date,
            type: isFabric ? "布料進貨" : "直接進貨",
            note: draft.note,
          });
          console.log("新增進貨單並更新庫存：", draft);
        };

        return (
          <section className="mt-7 rounded-lg border border-neutral-200 bg-[#D6DEC9] shadow-sm">
            <DocFormHeader title="新建進貨單" helper="收到商品後建立進貨單，送出時會增加庫存。" onBack={onBack} submitLabel="建立進貨單" />
            <form {...formValidationProps} id="flow-doc-form" onSubmit={submit} className="space-y-6 p-5">
              <OrderSection title="進貨單資料" helper="布料商品必須指定批號，同款布料不同批號分別管理。">
                <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
                  <FormField label="進貨單號"><input required value={draft.id} onChange={(event) => updateDraft("id", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="來源單號"><input value={draft.source} onChange={(event) => updateDraft("source", event.target.value)} placeholder="可填採購單號" className={inputClass} /></FormField>
                  <FormField label="進貨日期"><input required type="date" value={draft.date} onChange={(event) => updateDraft("date", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="廠商"><input required value={draft.vendor} onChange={(event) => updateDraft("vendor", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="商品"><ProductSelectField products={products} value={draft.productId} onChange={(value) => updateDraft("productId", value)} /></FormField>
                  <FormField label={`數量${isFabric ? "（公尺）" : "（件）"}`}>
                    <input required type="number" min={isFabric ? "0.1" : "1"} step={isFabric ? "0.1" : "1"} value={draft.qty} onChange={(event) => updateDraft("qty", event.target.value)} className={inputClass} />
                  </FormField>
                  {isFabric && (
                    <>
                      <FormField label="批號方式">
                        <select value={draft.batchMode} onChange={(event) => updateDraft("batchMode", event.target.value)} className={inputClass}>
                          <option value="existing">併入既有批號</option>
                          <option value="new">建立新批號</option>
                        </select>
                      </FormField>
                      <FormField label="批號">
                        {draft.batchMode === "new" ? (
                          <input readOnly value={proposedBatch} className={`${inputClass} bg-neutral-50 text-neutral-500`} />
                        ) : (
                          <select required value={draft.batchNo} onChange={(event) => updateDraft("batchNo", event.target.value)} className={inputClass}>
                            <option value="">選擇批號</option>
                            {fabricLots.map((fabric) => (
                              <option key={fabric.lot} value={fabric.lot}>
                                {fabric.lot}（目前 {formatFabricQuantity(fabric.stock)} 公尺）
                              </option>
                            ))}
                          </select>
                        )}
                      </FormField>
                    </>
                  )}
                  <FormField label="備註"><input value={draft.note} onChange={(event) => updateDraft("note", event.target.value)} className={inputClass} /></FormField>
                </div>
              </OrderSection>
            </form>
          </section>
        );
      }

      function NewConsignmentPage({ products, onBack, onSave }) {
        const [draft, setDraft] = useState(createEmptyConsignmentDraft);
        const selectedProduct = products.find((product) => String(product.id) === String(draft.productId));
        const updateDraft = (field, value) => setDraft((current) => ({ ...current, [field]: value }));
        const submit = (event) => {
          event.preventDefault();
          if (!draft.id.trim() || !draft.location.trim() || !draft.productId || !Number(draft.qty)) {
            alert("請填入單號、地點、商品與數量。正確格式：單號與地點為文字；商品需從下拉選單選擇；數量需為大於 0 的整數。");

          }
          onSave({
            ...draft,
            productName: selectedProduct?.name || "",
            qty: Number(draft.qty) || 0,
          });
          console.log("新增寄售/快閃單據：", draft);
        };

        return (
          <section className="mt-7 rounded-lg border border-neutral-200 bg-[#D6DEC9] shadow-sm">
            <DocFormHeader title="新建寄售/快閃單據" helper="建立寄售點、快閃活動或市集備貨紀錄。" onBack={onBack} submitLabel="建立單據" />
            <form {...formValidationProps} id="flow-doc-form" onSubmit={submit} className="space-y-6 p-5">
              <OrderSection title="寄售/快閃資料" helper="此單據目前先記錄作業資訊，後續可接庫存轉倉或結算流程。">
                <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
                  <FormField label="單號"><input required value={draft.id} onChange={(event) => updateDraft("id", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="地點/合作單位"><input required value={draft.location} onChange={(event) => updateDraft("location", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="狀態">
                    <select value={draft.status} onChange={(event) => updateDraft("status", event.target.value)} className={inputClass}>
                      {["寄售中", "快閃準備", "待結算", "已結算"].map((status) => <option key={status}>{status}</option>)}
                    </select>
                  </FormField>
                  <FormField label="商品"><ProductSelectField products={products} value={draft.productId} onChange={(value) => updateDraft("productId", value)} /></FormField>
                  <FormField label="數量"><input required type="number" min="1" step="1" value={draft.qty} onChange={(event) => updateDraft("qty", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="開始日期"><input type="date" value={draft.startDate} onChange={(event) => updateDraft("startDate", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="結束日期"><input type="date" value={draft.endDate} onChange={(event) => updateDraft("endDate", event.target.value)} className={inputClass} /></FormField>
                  <FormField label="備註"><input value={draft.note} onChange={(event) => updateDraft("note", event.target.value)} className={inputClass} /></FormField>
                </div>
              </OrderSection>
            </form>
          </section>
