      function DatabaseTable({ title, helper, docs, columns, onView, onEdit, onDocsChange, compact = false }) {
        const [tableDocs, setTableDocs] = useState(docs);
        const [searchTerm, setSearchTerm] = useState("");
        const [statusFilter, setStatusFilter] = useState("all");
        const [selectedIds, setSelectedIds] = useState([]);

        useEffect(() => {
          setTableDocs(docs);
          setSelectedIds([]);
        }, [docs]);

        const rows = tableDocs.map((doc) => {
          if (columns.includes("stock") && columns.includes("price")) {
            return {
              ...doc,
              status: doc.stock < 10 ? "低庫存" : "正常",
            };
          }
          return doc;
        });
        const statusOptions = Array.from(new Set(rows.map((row) => getRecordStatus(row, columns)).filter(Boolean)));
        const visibleRows = rows.filter((row) => {
          const status = getRecordStatus(row, columns);
          const matchesStatus = statusFilter === "all" || status === statusFilter;
          const matchesSearch = getRecordSearchText(row, columns).includes(searchTerm.trim().toLowerCase());
          return matchesStatus && matchesSearch;
        });
        const visibleIds = visibleRows.map(getRecordKey);
        const allVisibleSelected = visibleIds.length > 0 && visibleIds.every((id) => selectedIds.includes(id));

        const updateRows = (updater) => {
          setTableDocs((current) => {
            const nextRows = typeof updater === "function" ? updater(current) : updater;
            if (onDocsChange) onDocsChange(nextRows);
            return nextRows;
          });
        };

        const toggleSelection = (id) => {
          setSelectedIds((current) =>
            current.includes(id) ? current.filter((item) => item !== id) : [...current, id]
          );
        };

        const toggleAllVisible = () => {
          setSelectedIds((current) => {
            if (allVisibleSelected) return current.filter((id) => !visibleIds.includes(id));
            return Array.from(new Set([...current, ...visibleIds]));
          });
        };

        const runBulkAction = (action) => {
          if (selectedIds.length === 0) return;
          updateRows((current) => applyBulkRecordAction(current, selectedIds, action));
          setSelectedIds([]);
        };

        const labels = {
          id: "編號",
          sku: "SKU 編碼",
          name: "名稱",
          phone: "電話",
          keyword: "關鍵字",
          recipient: "收件人",
          sevenStore: "7-11取貨門市",
          familyStore: "全家取貨門市",
          invoiceCarrier: "發票載具",
          city: "縣市",
          district: "區",
          address: "地址",
          contact: "聯絡人",
          type: "類型",
          manager: "負責人",
          role: "使用者類型",
          account: "帳號",
          password: "密碼",
          email: "E-mail",
          category: "分類",
          status: "狀態",
          note: "備註",
          warehouses: "可見倉庫",
          specialty: "專長",
          commission: "抽成",
          region: "區域",
          productName: "商品",
          fabricCount: "布料款數",
          fabricItems: "布料明細",
          stock: "目前庫存",
          price: "單價",
          qty: "數量",
          receivedDate: "收貨日期",
          expireDate: "效期",

        return (
          <div>

              </div>
              <div className="grid gap-3 lg:grid-cols-[1fr_220px]">
                <label className="block">
                  <span className="mb-2 block text-sm font-medium text-neutral-700">搜尋</span>
                  <input
                    value={searchTerm}
                    onChange={(event) => setSearchTerm(event.target.value)}
                    placeholder="輸入關鍵字搜尋目前列表"
                    className="h-10 w-full rounded-md border border-neutral-300 bg-white px-3 text-sm outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10"

                </label>
                <label className="block">
                  <span className="mb-2 block text-sm font-medium text-neutral-700">狀態</span>

                  >
                    <option value="all">所有狀態</option>
                    {statusOptions.map((status) => (
                      <option key={status} value={status}>{status}</option>

                </label>
              </div>
              <div className="flex flex-col gap-3 rounded-lg border border-neutral-200 bg-neutral-50 px-3 py-3 sm:flex-row sm:items-center sm:justify-between">
                <p className="text-sm text-neutral-600">
                  已選取 <span className="font-semibold text-neutral-950">{selectedIds.length}</span> 筆，顯示 {visibleRows.length} 筆

                <div className="flex flex-wrap gap-2">
                  <button type="button" onClick={() => runBulkAction("enable")} disabled={!selectedIds.length} className="h-9 rounded-md border border-neutral-300 bg-white px-3 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 disabled:cursor-not-allowed disabled:opacity-40">批量啟用</button>
                  <button type="button" onClick={() => runBulkAction("disable")} disabled={!selectedIds.length} className="h-9 rounded-md border border-neutral-300 bg-white px-3 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 disabled:cursor-not-allowed disabled:opacity-40">批量停用</button>
                  <button type="button" onClick={() => runBulkAction("delete")} disabled={!selectedIds.length} className="h-9 rounded-md bg-red-600 px-3 text-sm font-medium text-white transition hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-40">批量刪除</button>
                </div>
              </div>
            </div>
            <div className="overflow-x-auto rounded-lg border border-neutral-200">
              <table className={`${compact ? "w-auto min-w-max" : "w-full min-w-[820px]"} text-left`}>
                <thead className="bg-neutral-50 text-xs uppercase tracking-wide text-neutral-500">
                  <tr>
                    <th className="px-4 py-3">
                      <input
                        type="checkbox"

                <tbody className="divide-y divide-neutral-100">
                  {visibleRows.map((doc) => (
                    <tr key={getRecordKey(doc)} className="transition hover:bg-neutral-50/80">
                      <td className="px-4 py-4">
                        <input
                          type="checkbox"
                          checked={selectedIds.includes(getRecordKey(doc))}
                          onChange={() => toggleSelection(getRecordKey(doc))}
                          className="h-4 w-4 rounded border-neutral-300 text-neutral-950 focus:ring-neutral-900"
                          aria-label={`選取 ${doc.name || doc.sku || doc.id}`}
                        />
                      </td>
                      {columns.map((column) => (
                        <td
                          key={column}
                          className={`px-4 py-4 text-sm ${
                            column === "id" || column === "sku" ? "font-mono text-neutral-600" : "text-neutral-700"
                          } ${compact ? "whitespace-nowrap" : ""}`}
                        >
                          {renderDatabaseCell(doc, column)}
                        </td>
                      ))}
                      <td className="px-4 py-4">
                        <div className="flex justify-end gap-2">
                          <button
                            className="rounded-md border border-neutral-300 px-3 py-2 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950"
                            onClick={() => (onView ? onView(doc) : console.log("查看資料：", doc))}
                          >
                            查看
                          </button>
                          <button
                            className="rounded-md bg-neutral-950 px-3 py-2 text-sm font-medium text-white transition hover:bg-neutral-700"
                            onClick={() => (onEdit ? onEdit(doc) : console.log("編輯資料：", doc))}
                          >
                            編輯
                          </button>

                      </td>
                    </tr>
                  ))}
                  {visibleRows.length === 0 && <EmptyRow colSpan={columns.length + 2} text="沒有符合條件的資料。" />}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      function renderDatabaseCell(doc, column) {
        if (column === "price") return formatCurrency(doc[column]);
        if (column === "qty" && doc.fabricManaged) return `${formatFabricQuantity(doc[column])} 公尺`;
        if (column === "fabricItems") {
          const items = Array.isArray(doc.items) ? doc.items : [];
          if (items.length === 0) return "-";
          return (
            <div className="space-y-1">
              {items.map((item) => (
                <div key={`${doc.id}-${item.productCode}-${item.productName}`} className="text-sm text-neutral-700">

                  <span className="ml-2 font-mono text-xs text-neutral-500">{item.productCode}</span>
                  <span className="ml-2 text-neutral-500">{formatFabricQuantity(item.qty)} 公尺</span>
                </div>
              ))}
            </div>
          );
        }
        if (column === "password") return doc[column] ? "••••••" : "";

          const greenStatuses = ["合作中", "可售", "可用", "正常", "啟用"];
          return <SmallBadge tone={greenStatuses.includes(doc[column]) ? "green" : "amber"}>{doc[column]}</SmallBadge>;

        return doc[column];

      function OrdersPanel({ orders, productMap, fabrics, onUpdate, onDelete, onCancel, onTransferToShipment, onShipItems }) {
        const [modalMode, setModalMode] = useState("view");
        const [selectedOrder, setSelectedOrder] = useState(null);
        const [orderEditDraft, setOrderEditDraft] = useState(null);

        const openOrderModal = (order, mode) => {
          setModalMode(mode);
          setSelectedOrder(order);
          setOrderEditDraft(createOrderEditDraft(order));
        };

        const closeOrderModal = () => {
          setSelectedOrder(null);
          setOrderEditDraft(null);
          setModalMode("view");
        };

        const saveOrderEdit = (event) => {
          event.preventDefault();
          if (!orderEditDraft) return;
          const items = orderEditDraft.items.map((item) => ({
            ...item,
            quantity: item.quantity,
            salePrice: item.salePrice,
            discountPercent: item.discountPercent,
          }));
          const nextDraft = { ...orderEditDraft, items };
          const updatedOrder = {
            ...selectedOrder,
            orderNo: selectedOrder.id,
            orderDate: nextDraft.orderDate,
            shippingCompletedDate: nextDraft.shippingCompletedDate,
            paymentCompletedDate: nextDraft.paymentCompletedDate,
            customer: nextDraft.customer.trim() || selectedOrder.customer,
            customerKeyword: nextDraft.customer.trim() || selectedOrder.customer,
            productName: items[0]?.productName || selectedOrder.productName,
            items,
            qty: getDraftTotalQuantity(nextDraft),
            amount: calculateDraftTotal(nextDraft),
            shippingMethod: nextDraft.shippingMethod,
            recipientName: nextDraft.recipientName,
            recipientAddress: nextDraft.recipientAddress,
            shipmentNo: getShipmentNoForMethod(nextDraft.shippingMethod, nextDraft.shipmentNo).trim(),
            orderType: nextDraft.orderType,
            needsPinkoiReview: nextDraft.orderType === "零售-PINKOI" ? Boolean(nextDraft.needsPinkoiReview) : false,
            shippingFee: Number(nextDraft.shippingFee) || 0,
            discountAmount: Number(nextDraft.discountAmount) || 0,
            invoiceMethod: nextDraft.invoiceMethod,
            invoiceCopy: nextDraft.invoiceCopy,
            invoiceNumber: nextDraft.invoiceNumber.trim(),
            paymentStatus: nextDraft.paymentStatus,
            receivedAmount: getReceivedAmount(nextDraft),
            outstandingAmount: getOutstandingAmount(nextDraft),
            paid: nextDraft.paymentStatus === "已付款",
            status: getOrderStatus({ ...selectedOrder, items }),
          };
          if (canTransferOrderToShipment(updatedOrder)) {
            const transferred = onTransferToShipment(updatedOrder);
            if (!transferred) return;
            closeOrderModal();
            console.log("訂單已完全出貨，移轉至出貨單：", updatedOrder);
            return;
          }
          onUpdate(updatedOrder);
          closeOrderModal();
          console.log("更新訂單資料：", updatedOrder);
        };

        const confirmDeleteOrder = (order) => {
          if (!window.confirm(`確定要刪除訂單 ${order.id}？此操作無法復原。`)) return;
          onDelete(order);
          console.log("刪除訂單：", order);
        };

        const confirmCancelOrder = (order) => {
          if (!window.confirm(`確定要取消訂單 ${order.id}？取消後會從未完成訂單列表移除。`)) return;
          onCancel({ ...order, status: "已取消", canceledAt: new Date().toISOString() });
          console.log("取消訂單：", order);
        };

        return (
          <DocumentShell title="訂單" helper="收到客戶訂購或預購後建立訂單；出貨、收款與發票完成後才轉為出貨單。">
            <table className="w-full min-w-[860px] text-left">
              <thead className="bg-neutral-50 text-xs uppercase tracking-wide text-neutral-500">
                <tr>
                  {["訂單編號", "客戶", "商品", "數量", "金額", "收款", "狀態", "操作"].map((item) => (
                    <th key={item} className="px-4 py-3 font-medium">{item}</th>
                  ))}
                </tr>
              </thead>
              <tbody className="divide-y divide-neutral-100">
                {orders.map((order) => (
                  <tr key={order.id}>
                    <td className="px-4 py-4 font-mono text-sm text-neutral-600">{order.id}</td>
                    <td className="px-4 py-4 text-sm font-medium text-neutral-950">{order.customer}</td>
                    <td className="px-4 py-4 text-sm text-neutral-600">{getOrderProductSummary(order, productMap)}</td>
                    <td className="px-4 py-4 text-sm text-neutral-700">{order.qty}</td>
                    <td className="px-4 py-4 text-sm text-neutral-700">{formatCurrency(order.amount)}</td>
                    <td className="px-4 py-4"><SmallBadge tone={getPaymentStatus(order) === "已付款" ? "green" : "amber"}>{getPaymentStatus(order)}</SmallBadge></td>
                    <td className="px-4 py-4"><SmallBadge>{getOrderStatus(order)}</SmallBadge></td>
                    <td className="px-4 py-4">
                      <div className="flex flex-wrap justify-end gap-1.5">
                        <button
                          type="button"
                          title="檢視"
                          aria-label={`檢視訂單 ${order.id}`}
                          className="flex h-9 w-9 items-center justify-center rounded-md border border-neutral-300 bg-white text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950"
                          onClick={() => openOrderModal(order, "view")}
                        >
                          <OrderActionIcon type="view" />
                        </button>
                        <button
                          type="button"
                          title="修改"
                          aria-label={`修改訂單 ${order.id}`}
                          className="flex h-9 w-9 items-center justify-center rounded-md border border-neutral-300 bg-white text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950"
                          onClick={() => openOrderModal(order, "edit")}
                        >
                          <OrderActionIcon type="edit" />
                        </button>
                        <button
                          type="button"
                          title="刪除"
                          aria-label={`刪除訂單 ${order.id}`}
                          className="flex h-9 w-9 items-center justify-center rounded-md border border-neutral-300 bg-white text-neutral-700 transition hover:border-red-500 hover:text-red-600"
                          onClick={() => confirmDeleteOrder(order)}
                        >
                          <OrderActionIcon type="delete" />
                        </button>
                        <button
                          type="button"
                          title="取消"
                          aria-label={`取消訂單 ${order.id}`}
                          className="flex h-9 w-9 items-center justify-center rounded-md border border-neutral-300 bg-white text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950"
                          onClick={() => confirmCancelOrder(order)}
                        >
                          <OrderActionIcon type="cancel" />
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
                {orders.length === 0 && <EmptyRow colSpan={8} text="目前沒有未完成訂單。" />}
              </tbody>
            </table>
            {selectedOrder && orderEditDraft && (
              <OrderRecordModal
                mode={modalMode}
                draft={orderEditDraft}
                setDraft={setOrderEditDraft}
                order={selectedOrder}
                productMap={productMap}
                fabrics={fabrics}
                onClose={closeOrderModal}
                onSubmit={saveOrderEdit}
                onRecordShipmentPrint={(printLog) => {
                  const nextOrder = {
                    ...selectedOrder,
                    shipmentPrintLogs: [printLog, ...(selectedOrder.shipmentPrintLogs || [])],
                  };
                  setSelectedOrder(nextOrder);
                  onUpdate(nextOrder);
                }}
                onShipItems={(shipmentItems, shippingDraft) => {
                  const shipped = onShipItems(selectedOrder.id, shipmentItems, shippingDraft);
                  if (shipped) closeOrderModal();
                  return shipped;
                }}
              />
            )}
          </DocumentShell>
        );
      }

      function mergeOrderWithDraft(order, draft) {
        if (!order || !draft) return order;
        const items = draft.items || order.items || [];
        return {
          ...order,
          orderDate: draft.orderDate,
          shippingCompletedDate: draft.shippingCompletedDate,
          paymentCompletedDate: draft.paymentCompletedDate,
          customer: String(draft.customer || "").trim() || order.customer,
          customerKeyword: String(draft.customer || "").trim() || order.customer,
          productName: items[0]?.productName || order.productName,
          items,
          qty: getDraftTotalQuantity({ ...draft, items }),
          amount: calculateDraftTotal({ ...draft, items }),
          shippingMethod: draft.shippingMethod,
          recipientName: draft.recipientName,
          recipientAddress: draft.recipientAddress,
          shipmentNo: getShipmentNoForMethod(draft.shippingMethod, draft.shipmentNo).trim(),
          orderType: draft.orderType,
          needsPinkoiReview: draft.orderType === "零售-PINKOI" ? Boolean(draft.needsPinkoiReview) : false,
          shippingFee: Number(draft.shippingFee) || 0,
          discountAmount: Number(draft.discountAmount) || 0,
          invoiceMethod: draft.invoiceMethod,
          invoiceCopy: draft.invoiceCopy,
          invoiceNumber: String(draft.invoiceNumber || "").trim(),
          paymentStatus: draft.paymentStatus,
          receivedAmount: getReceivedAmount({ ...draft, items }),
          outstandingAmount: getOutstandingAmount({ ...draft, items }),
          paid: draft.paymentStatus === "已付款",
        };
      }

      function createOrderEditDraft(order) {
        const items = (order.items && order.items.length ? order.items : [{ productName: order.productName, quantity: order.qty, salePrice: order.amount, discountPercent: 100 }]).map((item) => ({
          ...item,
          id: item.id || createEmptyOrderItem().id,
          productKeyword: item.productKeyword || item.sku || "",
          productName: item.productName || "",
          quantity: String(item.quantity || ""),
          shippedQuantity: String(item.shippedQuantity || ""),
          salePrice: String(item.salePrice || ""),
          discountPercent: String(item.discountPercent ?? 100),
          isPreorder: Boolean(item.isPreorder),
          batchNo: item.batchNo || "",
        }));

        return {
          orderNo: order.id || order.orderNo || "",
          orderDate: order.orderDate || "",
          shippingCompletedDate: order.shippingCompletedDate || "",
          paymentCompletedDate: order.paymentCompletedDate || "",
          customer: order.customer || "",
          customerId: order.customerId || "",
          customerKeyword: order.customerKeyword || order.customer || "",
          shippingMethod: order.shippingMethod || "7-11",
          recipientName: order.recipientName || "",
          recipientAddress: order.recipientAddress || "",
          shipmentNo: order.shipmentNo || "",
          orderType: order.orderType || "零售-官網",
          needsPinkoiReview: Boolean(order.needsPinkoiReview),
          shippingFee: String(order.shippingFee || 0),
          discountAmount: String(order.discountAmount || 0),
          invoiceMethod: order.invoiceMethod || "不開發票",
          invoiceCopy: order.invoiceCopy || "二聯",
          invoiceNumber: order.invoiceNumber || "",
          paymentStatus: getPaymentStatus(order),
          receivedAmount: String(order.receivedAmount || ""),
          status: getOrderStatus(order),
          items,
        };
      }

      function OrderRecordModal({ mode, draft, setDraft, order, productMap, fabrics, onClose, onSubmit, onRecordShipmentPrint, onShipItems }) {
        const isViewMode = mode === "view";
        const modalTitle = isViewMode ? "檢視訂單資料" : "修改訂單資料";
        const inputClass = "h-10 w-full rounded-md border border-neutral-300 bg-white px-3 text-sm outline-none transition placeholder:text-neutral-400 focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10 disabled:cursor-not-allowed disabled:bg-neutral-100 disabled:text-neutral-500";
        const shippingMethods = ["面交", "郵局", "便利帶", "7-11", "全家", "其他"];
        const orderTypes = ["零售-官網", "零售-PINKOI", "零售-店售", "零售-市集", "批發", "寄售點", "公關", "同修", "裁縫"];
        const invoiceMethodOptions = ["不開發票", "手開發票", "電子發票"];
        const invoiceCopyOptions = ["二聯", "三聯"];
        const totalAmount = calculateDraftTotal(draft);
        const receivedAmount = getReceivedAmount(draft);
        const outstandingAmount = getOutstandingAmount(draft);
        const [isShippingMode, setIsShippingMode] = useState(false);
        const [shipmentDraft, setShipmentDraft] = useState([]);
        const [printedShipmentItems, setPrintedShipmentItems] = useState([]);
        const [shipmentPrintLogs, setShipmentPrintLogs] = useState(order.shipmentPrintLogs || []);
        const [showPrintLogPrompt, setShowPrintLogPrompt] = useState(false);
        const latestPrintLog = shipmentPrintLogs[0];
        const selectedShipmentItems = shipmentDraft.filter((item) => item.selected && (Number(item.shipQuantity) || 0) > 0);
        const shippableItems = shipmentDraft.filter((item) => getRemainingShipmentQuantity(item) > 0);
        const allShippableSelected = shippableItems.length > 0 && shippableItems.every((item) => item.selected);
        const getItemProduct = (item) => productMap[item.productId];
        const getAvailableFabricLots = (product, currentBatchNo = "") =>
          getFabricLotsForProduct(fabrics, product).filter((fabric) => normalizeFabricQuantity(fabric.stock) > 0 || fabric.lot === currentBatchNo);

        const updateDraft = (field, value) => {
          setDraft((current) => ({ ...current, [field]: value }));
        };

        const updateShippingMethod = (method) => {
          setDraft((current) => ({
            ...current,
            shippingMethod: method,
            shipmentNo: getShipmentNoForMethod(method, current.shipmentNo),
          }));
        };

        const updateItem = (itemId, field, value) => {
          setDraft((current) => ({
            ...current,
            items: current.items.map((item) => (item.id === itemId ? { ...item, [field]: value } : item)),
          }));
        };

        const startShippingMode = (action = "ship") => {
          setShipmentDraft(
            draft.items.map((item) => {
              const remainingQty = getRemainingShipmentQuantity(item);
              return {
                ...item,
                selected: false,
                shipQuantity: remainingQty > 0 ? String(remainingQty) : "",
              };
            })
          );
          setPrintedShipmentItems([]);
          setIsShippingMode(true);
          setShowPrintLogPrompt(action === "ship" && Boolean(latestPrintLog));
        };

        const cancelShippingMode = () => {
          setIsShippingMode(false);
          setShipmentDraft([]);
          setPrintedShipmentItems([]);
          setShowPrintLogPrompt(false);
        };

        const toggleShipmentItem = (itemId, checked) => {
          setShipmentDraft((current) =>
            current.map((item) => {
              if (item.id !== itemId) return item;
              const remainingQty = getRemainingShipmentQuantity(item);
              return {
                ...item,
                selected: checked,
                shipQuantity: checked ? String(remainingQty) : item.shipQuantity,
              };
            })
          );
        };

        const toggleAllShipmentItems = (checked) => {
          setShipmentDraft((current) =>
            current.map((item) => {
              const remainingQty = getRemainingShipmentQuantity(item);
              return remainingQty > 0
                ? { ...item, selected: checked, shipQuantity: checked ? String(remainingQty) : item.shipQuantity }
                : item;
            })
          );
        };

        const updateShipmentQuantity = (itemId, value) => {
          setShipmentDraft((current) =>
            current.map((item) => {
              if (item.id !== itemId) return item;
              const remainingQty = getRemainingShipmentQuantity(item);
              const itemProduct = productMap[item.productId];
              const rawQty = Math.min(Math.max(Number(value) || 0, 0), remainingQty);
              const nextQty = isFabricProduct(itemProduct) ? normalizeFabricQuantity(rawQty) : rawQty;
              return { ...item, shipQuantity: value === "" ? "" : String(nextQty), selected: nextQty > 0 };
            })
          );
        };

        const printShipmentList = () => {
          if (selectedShipmentItems.length === 0) {
            alert("請先選取要列印的商品與數量。正確格式：商品需勾選，列印數量需為大於 0 且不超過未出貨數量的數字。");
            return;
          }
          const printableItems = selectedShipmentItems.map((item) => ({
            id: item.id,
            productId: item.productId,
            productKeyword: item.productKeyword,
            productName: item.productName,
            batchNo: item.batchNo || "",
            shipQuantity: String(item.batchNo ? normalizeFabricQuantity(item.shipQuantity) : Number(item.shipQuantity) || 0),
          }));
          const printLog = {
            id: `PL-${Date.now().toString().slice(-6)}`,
            date: new Date().toISOString().slice(0, 10),
            items: printableItems,
          };
          setPrintedShipmentItems(printableItems);
          setShipmentPrintLogs((current) => [printLog, ...current]);
          onRecordShipmentPrint(printLog);
          console.log("產生出貨單列印清單：", { order, items: printableItems });
          setTimeout(() => window.print(), 0);
        };

        const applyLatestPrintLog = () => {
          if (!latestPrintLog) return;
          setShipmentDraft((current) =>
            current.map((item) => {
              const printedItem = latestPrintLog.items.find((logItem) => logItem.id === item.id);
              if (!printedItem) return { ...item, selected: false };
              const remainingQty = getRemainingShipmentQuantity(item);
              const nextQty = Math.min(Number(printedItem.shipQuantity) || 0, remainingQty);
              return {
                ...item,
                selected: nextQty > 0,
                shipQuantity: nextQty > 0 ? String(nextQty) : "",
              };
            })
          );
          setPrintedShipmentItems(latestPrintLog.items);
          setShowPrintLogPrompt(false);
        };

        const submitShipment = () => {
          if (selectedShipmentItems.length === 0) {
            alert("請先選取要出貨的商品與數量。正確格式：商品需勾選，出貨數量需為大於 0 且不超過未出貨數量的數字。");
            return;
          }
          onShipItems(selectedShipmentItems, draft);
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-neutral-950/35 px-4 py-6">
            {printedShipmentItems.length > 0 && (
              <style>{`
                @media print {
                  body * { visibility: hidden; }
                  #shipment-print-page, #shipment-print-page * { visibility: visible; }
                  #shipment-print-page {
                    position: absolute;
                    left: 0;
                    top: 0;
                    width: 210mm;
                    min-height: 297mm;
                    box-shadow: none !important;
                    border: 0 !important;
                  }
                  @page { size: A4 portrait; margin: 12mm; }
                }
              `}</style>
            )}
            <div className="max-h-[90vh] w-full max-w-5xl overflow-y-auto rounded-lg border border-neutral-200 bg-[#D6DEC9] shadow-xl">
              <div className="flex items-start justify-between gap-4 border-b border-neutral-100 px-5 py-4">
                <div>
                  <h3 className="text-lg font-semibold text-neutral-950">{modalTitle}</h3>
                </div>
                <button type="button" onClick={onClose} className="rounded-md border border-neutral-300 px-3 py-2 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950">
                  關閉
                </button>
              </div>

              <form {...formValidationProps} onSubmit={onSubmit} className="space-y-5 p-5">
                <OrderSection title="客戶訂單-表頭" helper="訂單基本資料">
                  <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
                  <FormField label="訂單編號">
                    <input readOnly value={draft.orderNo} className={`${inputClass} bg-neutral-100 text-neutral-500`} />
                  </FormField>
                  <FormField label="訂單成立日期">
                    <input disabled={isViewMode} type="date" value={draft.orderDate} onChange={(event) => updateDraft("orderDate", event.target.value)} className={inputClass} />
                  </FormField>
                  <FormField label="出貨完成日期">
                    <input disabled={isViewMode} type="date" value={draft.shippingCompletedDate} onChange={(event) => updateDraft("shippingCompletedDate", event.target.value)} className={inputClass} />
                  </FormField>
                  <FormField label="出款完成日期">
                    <input disabled={isViewMode} type="date" value={draft.paymentCompletedDate} onChange={(event) => updateDraft("paymentCompletedDate", event.target.value)} className={inputClass} />
                  </FormField>
                  <FormField label="客戶資料">
                    <input disabled={isViewMode} value={draft.customer} onChange={(event) => updateDraft("customer", event.target.value)} className={inputClass} />
                  </FormField>
                  <FormField label="收款狀態">
                    <select disabled={isViewMode} value={draft.paymentStatus} onChange={(event) => updateDraft("paymentStatus", event.target.value)} className={inputClass}>
                      {paymentStatusOptions.map((status) => <option key={status}>{status}</option>)}
                    </select>
                  </FormField>
                  {requiresReceivedAmount(draft.paymentStatus) && (
                    <FormField label="已收金額">
                      <input disabled={isViewMode} type="number" min="0" value={draft.receivedAmount} onChange={(event) => updateDraft("receivedAmount", event.target.value)} className={inputClass} />
                    </FormField>
                  )}
                  <FormField label="出貨方式">
                    <select disabled={isViewMode} value={draft.shippingMethod} onChange={(event) => updateShippingMethod(event.target.value)} className={inputClass}>
                      {shippingMethods.map((method) => <option key={method}>{method}</option>)}
                    </select>
                  </FormField>
                  <FormField label="出貨單號">
                    <input disabled={isViewMode} value={draft.shipmentNo} onChange={(event) => updateDraft("shipmentNo", event.target.value)} className={inputClass} />
                  </FormField>
                  <FormField label="類型">
                    <select disabled={isViewMode} value={draft.orderType} onChange={(event) => updateDraft("orderType", event.target.value)} className={inputClass}>
                      {orderTypes.map((type) => <option key={type}>{type}</option>)}
                    </select>
                  </FormField>
                  {draft.orderType === "零售-PINKOI" && (
                    <FormField label="PINKOI">
                      <label className="flex h-10 items-center gap-2 rounded-md border border-neutral-200 bg-neutral-50 px-3 text-sm text-neutral-700">
                        <input
                          disabled={isViewMode}
                          type="checkbox"
                          checked={Boolean(draft.needsPinkoiReview)}
                          onChange={(event) => updateDraft("needsPinkoiReview", event.target.checked)}
                          className="h-4 w-4 rounded border-neutral-300 text-neutral-950 focus:ring-neutral-900 disabled:cursor-not-allowed"
                        />
                        給評價
                      </label>
                    </FormField>
                  )}
                  <FormField label="運費">
                    <input disabled={isViewMode} type="number" min="0" value={draft.shippingFee} onChange={(event) => updateDraft("shippingFee", event.target.value)} className={inputClass} />
                  </FormField>
                  <FormField label="優惠">
                    <input disabled={isViewMode} type="number" min="0" value={draft.discountAmount} onChange={(event) => updateDraft("discountAmount", event.target.value)} className={inputClass} />
                  </FormField>
                  <FormField label="商品總數量">
                    <input readOnly value={getDraftTotalQuantity(draft)} className={`${inputClass} bg-neutral-100 text-neutral-500`} />
                  </FormField>
                  <FormField label="狀態">
                    <input readOnly value={getOrderStatus(draft)} className={`${inputClass} bg-neutral-100 text-neutral-500`} />
                  </FormField>
                  <FormField label="合計">
                    <input readOnly value={formatCurrency(totalAmount)} className={`${inputClass} bg-neutral-100 text-neutral-500`} />
                  </FormField>
                  <FormField label="待收金額">
                    <input readOnly value={formatCurrency(outstandingAmount)} className={`${inputClass} bg-neutral-100 text-neutral-500`} />
                  </FormField>
                  <FormField label="收件資料">
                    <textarea
                      disabled={isViewMode}
                      value={draft.recipientAddress}
                      onChange={(event) => updateDraft("recipientAddress", event.target.value)}
                      className={`${inputClass} min-h-24 py-2`}
                    />
                  </FormField>
                  <div className="md:col-span-2 xl:col-span-3">
                    <div className="mb-2 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                      <label className="block text-sm font-medium text-neutral-700">發票</label>
                      <div className="flex flex-wrap gap-2">
                        <select disabled={isViewMode} value={draft.invoiceMethod} onChange={(event) => updateDraft("invoiceMethod", event.target.value)} className="h-9 rounded-md border border-neutral-300 bg-white px-3 text-sm outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10 disabled:cursor-not-allowed disabled:bg-neutral-100 disabled:text-neutral-500">
                          {invoiceMethodOptions.map((type) => <option key={type}>{type}</option>)}
                        </select>
                        <select disabled={isViewMode} value={draft.invoiceCopy} onChange={(event) => updateDraft("invoiceCopy", event.target.value)} className="h-9 rounded-md border border-neutral-300 bg-white px-3 text-sm outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10 disabled:cursor-not-allowed disabled:bg-neutral-100 disabled:text-neutral-500">
                          {invoiceCopyOptions.map((type) => <option key={type}>{type}</option>)}
                        </select>
                      </div>
                    </div>
                    <input disabled={isViewMode} value={draft.invoiceNumber} onChange={(event) => updateDraft("invoiceNumber", event.target.value)} placeholder="輸入發票號碼或備註" className={inputClass} />
                  </div>
                  </div>
                </OrderSection>

                {!isViewMode && !isShippingMode && (
                  <div className="flex flex-wrap justify-end gap-2 rounded-lg border border-neutral-200 bg-neutral-50 px-4 py-3">
                    <button type="button" onClick={() => startShippingMode("ship")} className="h-10 rounded-md bg-neutral-950 px-4 text-sm font-medium text-white transition hover:bg-neutral-700">
                      出貨
                    </button>
                    <button type="button" onClick={() => startShippingMode("print")} className="h-10 rounded-md border border-neutral-300 bg-white px-4 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950">
                      列印出貨單
                    </button>
                  </div>
                )}

                {isShippingMode && (
                  <div className="rounded-lg border border-neutral-200 bg-neutral-50 px-4 py-3">
                    <p className="text-sm font-medium text-neutral-950">選取本次要出貨或列印的商品與數量。</p>
                  </div>
                )}

                {isShippingMode && showPrintLogPrompt && latestPrintLog && (
                  <div className="rounded-lg border border-amber-200 bg-amber-50 p-4">
                    <div className="flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
                      <div>
                        <h4 className="text-sm font-semibold text-neutral-950">是否依照最近一次出貨單紀錄出貨？</h4>
                        <p className="mt-1 text-sm text-neutral-600">最近列印日期：{latestPrintLog.date}，清單如下。</p>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        <button type="button" onClick={applyLatestPrintLog} className="h-9 rounded-md bg-neutral-950 px-3 text-sm font-medium text-white transition hover:bg-neutral-700">
                          使用此紀錄
                        </button>
                        <button type="button" onClick={() => setShowPrintLogPrompt(false)} className="h-9 rounded-md border border-neutral-300 bg-white px-3 text-sm font-medium text-neutral-700 transition hover:border-neutral-950 hover:text-neutral-950">
                          不使用
                        </button>
                      </div>
                    </div>
                    <div className="mt-3 divide-y divide-amber-100 rounded-md border border-amber-100 bg-white">
                      {latestPrintLog.items.map((item) => (
                        <div key={item.id} className="flex justify-between gap-3 px-3 py-2 text-sm">
                          <span className="text-neutral-700">
                            {item.productName || productMap[item.productId]?.name || item.productKeyword || "自訂商品"}
                            {item.batchNo ? <span className="ml-2 font-mono text-xs text-neutral-500">#{item.batchNo}</span> : null}
                          </span>
                          <span className="font-medium text-neutral-950">
                            {formatOrderItemQuantity(item, item.shipQuantity, productMap)} {getOrderItemUnit(item, productMap)}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="overflow-x-auto rounded-lg border border-neutral-200">
                  <table className="w-full min-w-[1120px] text-left">
                    <thead className="bg-neutral-50 text-xs uppercase tracking-wide text-neutral-500">
                      <tr>
                        {isShippingMode && (
                          <th className="px-4 py-3 font-medium">
                            <input
                              type="checkbox"
                              checked={allShippableSelected}
                              onChange={(event) => toggleAllShipmentItems(event.target.checked)}
                              className="h-4 w-4 rounded border-neutral-300 text-neutral-950 focus:ring-neutral-900"
                              aria-label="全選可出貨商品"
                            />
                          </th>
                        )}
                        {["商品編號", "商品名稱", "批號", "預購", "數量", "已出貨", ...(isShippingMode ? ["本次出貨"] : []), "銷售金額", "折扣", "小計"].map((item) => (
                          <th key={item} className="px-4 py-3 font-medium">{item}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-neutral-100">
                      {draft.items.map((item) => {
                        const isFullyShipped = isOrderItemFullyShipped(item);
                        const shipmentItem = shipmentDraft.find((draftItem) => draftItem.id === item.id) || item;
                        const itemProduct = getItemProduct(item);
                        const itemFabricLots = getAvailableFabricLots(itemProduct, item.batchNo);
                        const needsBatchNo = isFabricProduct(itemProduct);
                        return (
                        <tr key={item.id} className={isViewMode && isFullyShipped ? "bg-neutral-50/70 text-neutral-400 opacity-60" : ""}>
                          {isShippingMode && (
                            <td className="px-4 py-4">
                              <input
                                type="checkbox"
                                disabled={isFullyShipped}
                                checked={Boolean(shipmentItem.selected)}
                                onChange={(event) => toggleShipmentItem(item.id, event.target.checked)}
                                className="h-4 w-4 rounded border-neutral-300 text-neutral-950 focus:ring-neutral-900 disabled:cursor-not-allowed disabled:opacity-40"
                              />
                            </td>
                          )}
                          <td className="px-4 py-4"><input disabled={isViewMode} value={item.productKeyword} onChange={(event) => updateItem(item.id, "productKeyword", event.target.value)} className={inputClass} /></td>
                          <td className="px-4 py-4"><input disabled={isViewMode} value={item.productName || productMap[item.productId]?.name || ""} onChange={(event) => updateItem(item.id, "productName", event.target.value)} className={inputClass} /></td>
                          <td className="px-4 py-4">
                            {needsBatchNo ? (
                              <select required={!isViewMode && needsBatchNo} disabled={isViewMode} value={item.batchNo || ""} onChange={(event) => updateItem(item.id, "batchNo", event.target.value)} className={inputClass}>
                                <option value="">選擇批號</option>
                                {itemFabricLots.map((fabric) => (
                                  <option key={fabric.lot} value={fabric.lot}>
                                    {fabric.lot}（剩餘 {formatFabricQuantity(fabric.stock)} 公尺）
                                  </option>
                                ))}
                              </select>
                            ) : (
                              <input readOnly value="-" className={`${inputClass} bg-neutral-50 text-neutral-400`} />
                            )}
                          </td>
                          <td className="px-4 py-4">
                            <input disabled={isViewMode} type="checkbox" checked={Boolean(item.isPreorder)} onChange={(event) => updateItem(item.id, "isPreorder", event.target.checked)} className="h-4 w-4 rounded border-neutral-300 text-neutral-950 focus:ring-neutral-900 disabled:cursor-not-allowed" />
                          </td>
                          <td className="px-4 py-4"><input disabled={isViewMode} type="number" min={needsBatchNo ? "0.1" : "0"} step={needsBatchNo ? "0.1" : "1"} value={item.quantity} onChange={(event) => updateItem(item.id, "quantity", event.target.value)} className={inputClass} /></td>
                          <td className="px-4 py-4"><input disabled={isViewMode} type="number" min="0" value={item.shippedQuantity} onChange={(event) => updateItem(item.id, "shippedQuantity", event.target.value)} className={inputClass} /></td>
                          {isShippingMode && (
                            <td className="px-4 py-4">
                                <input
                                  disabled={isFullyShipped}
                                  type="number"
                                  min="0"
                                  step={isFabricProduct(itemProduct) ? "0.1" : "1"}
                                  max={getRemainingShipmentQuantity(item)}
                                  value={shipmentItem.shipQuantity || ""}
                                onChange={(event) => updateShipmentQuantity(item.id, event.target.value)}
                                className={inputClass}
                              />
                            </td>
                          )}
                          <td className="px-4 py-4"><input disabled={isViewMode} type="number" min="0" value={item.salePrice} onChange={(event) => updateItem(item.id, "salePrice", event.target.value)} className={inputClass} /></td>
                          <td className="px-4 py-4"><input disabled={isViewMode} type="number" min="0" max="100" value={item.discountPercent} onChange={(event) => updateItem(item.id, "discountPercent", event.target.value)} className={inputClass} /></td>
                          <td className="px-4 py-4 text-sm font-semibold text-neutral-950">{formatCurrency(calculateOrderItemSubtotal(item))}</td>
                        </tr>
                      );
                      })}
                    </tbody>
                  </table>
                </div>

                {printedShipmentItems.length > 0 && (
                  <div id="shipment-print-page" className="rounded-lg border border-neutral-200 bg-white p-6 text-neutral-950">
                    <div className="flex flex-col gap-4 border-b border-neutral-200 pb-4 sm:flex-row sm:items-start sm:justify-between">
                      <div>
                        <h4 className="text-2xl font-semibold tracking-tight text-neutral-950">出貨單</h4>
                        <p className="mt-2 text-sm text-neutral-500">訂單編號：{order.id}</p>
                        <p className="mt-1 text-sm text-neutral-500">客戶：{draft.customer}</p>
                      </div>
                      <div className="text-sm text-neutral-600 sm:text-right">
                        <p>列印日期：{new Date().toISOString().slice(0, 10)}</p>
                        <p className="mt-1">收款狀態：{draft.paymentStatus}</p>
                        <p className="mt-1 font-semibold text-neutral-950">
                          共 {printedShipmentItems.length} 項
                        </p>
                      </div>
                    </div>
                    <table className="mt-5 w-full border-collapse text-left text-sm">
                      <thead>
                        <tr className="border-b border-neutral-300 text-neutral-500">
                          <th className="py-2 pr-3 font-medium">商品編號</th>
                          <th className="px-3 py-2 font-medium">商品名稱</th>
                          <th className="px-3 py-2 font-medium">批號</th>
                          <th className="py-2 pl-3 text-right font-medium">出貨數量</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-neutral-100">
                        {printedShipmentItems.map((item) => (
                          <tr key={item.id}>
                            <td className="py-3 pr-3 font-mono text-neutral-600">{item.productKeyword || productMap[item.productId]?.sku || "-"}</td>
                            <td className="px-3 py-3 font-medium text-neutral-950">{item.productName || productMap[item.productId]?.name || item.productKeyword || "自訂商品"}</td>
                            <td className="px-3 py-3 font-mono text-neutral-600">{getBatchLabel(item.batchNo)}</td>
                            <td className="py-3 pl-3 text-right font-semibold text-neutral-950">
                              {formatOrderItemQuantity(item, item.shipQuantity, productMap)} {getOrderItemUnit(item, productMap)}
                            </td>
                          </tr>
                        ))}
                      </tbody>

      function PurchasesPanel({ purchases, productMap, onReceive }) {
        const getPurchaseItems = (purchase) => (
          purchase.items && purchase.items.length
            ? purchase.items
            : [{ productId: purchase.productId, productName: purchase.productName, qty: purchase.qty }]
        );
        const getPurchaseSummary = (purchase) => {
          const items = getPurchaseItems(purchase);
          const firstProduct = productMap[items[0]?.productId];
          const firstName = firstProduct?.name || items[0]?.productName || "-";
          return items.length > 1 ? `${firstName} 等 ${items.length} 項` : firstName;
        };
        const getPurchaseQuantitySummary = (purchase) => {
          const items = getPurchaseItems(purchase);
          const hasFabric = items.some((item) => isFabricProduct(productMap[item.productId]));
          if (hasFabric && items.length > 1) return `${items.length} 項`;
          const totalQty = items.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
          return hasFabric ? `${formatFabricQuantity(totalQty)} 公尺` : `${totalQty} 件`;
        };

        return (
          <DocumentShell title="採購單" helper="已向廠商叫貨後建立採購單；到貨清點後可依實收商品轉進貨單，支援不同採購單的部分商品彙整處理。">

                    <td className="px-4 py-4 text-sm text-neutral-600">{getPurchaseSummary(purchase)}</td>
                    <td className="px-4 py-4 text-sm text-neutral-700">{getPurchaseQuantitySummary(purchase)}</td>
                    <td className="px-4 py-4 text-sm text-neutral-700">{formatCurrency(purchase.amount)}</td>
                    <td className="px-4 py-4"><SmallBadge tone="amber">{purchase.status}</SmallBadge></td>
                    <td className="px-4 py-4">
                      <button className="rounded-md bg-neutral-950 px-3 py-2 text-sm font-medium text-white transition hover:bg-neutral-700" onClick={() => onReceive(purchase.id)}>

      function LoginPage({ users, onLogin }) {
        const activeUsers = users.filter((user) => user.status === "啟用");
        const [userId, setUserId] = useState(activeUsers[0]?.id || "");
        const [password, setPassword] = useState("");
        const [error, setError] = useState("");

        useEffect(() => {
          if (!activeUsers.some((user) => user.id === userId)) {
            setUserId(activeUsers[0]?.id || "");
          }
        }, [users]);

        const submitLogin = (event) => {
          event.preventDefault();
          if (!userId || !/^\d{6}$/.test(password)) {
            setError("請選擇使用者並輸入 6 位數字密碼。");
            return;
          }
          const success = onLogin({ userId, password });
          if (!success) {
            setError("密碼錯誤，或使用者已停用。");
          }
        };

        return (
          <main className="flex min-h-screen items-center justify-center bg-[#DDE3D5] px-5 py-10 text-neutral-900">
            <section className="w-full max-w-md rounded-lg border border-neutral-200 bg-[#D6DEC9] p-6 shadow-sm">
              <div className="mb-6">
                <p className="text-sm font-medium text-neutral-500">Inventory ERP</p>
                <h1 className="mt-2 text-2xl font-semibold text-neutral-950">登入系統</h1>
              </div>

              <form {...formValidationProps} onSubmit={submitLogin} className="space-y-4">
                <label className="block">
                  <span className="mb-2 block text-sm font-medium text-neutral-700">使用者</span>
                  <select
                    required
                    value={userId}
                    onChange={(event) => {
                      setUserId(event.target.value);
                      setError("");
                    }}
                    className="h-11 w-full rounded-md border border-neutral-300 bg-white px-3 text-sm outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10"
                  >
                    {activeUsers.map((user) => (
                      <option key={user.id} value={user.id}>
                        {user.id} {user.name}
                      </option>
                    ))}
                  </select>
                </label>

                <label className="block">
                  <span className="mb-2 block text-sm font-medium text-neutral-700">密碼</span>
                  <input
                    required
                    type="password"
                    inputMode="numeric"
                    maxLength="6"
                    pattern="[0-9]{6}"
                    value={password}
                    onChange={(event) => {
                      setPassword(event.target.value.replace(/\D/g, "").slice(0, 6));
                      setError("");
                    }}
                    placeholder="預設 000000"
                    autoComplete="current-password"
                    className="h-11 w-full rounded-md border border-neutral-300 bg-white px-3 text-sm outline-none transition placeholder:text-neutral-400 focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10"
                  />
                </label>

                {error && (
                  <div className="rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">
                    {error}
                  </div>
                )}

                <button type="submit" className="h-11 w-full rounded-md bg-neutral-950 px-4 text-sm font-medium text-white transition hover:bg-neutral-700">
                  登入
                </button>
              </form>
            </section>
          </main>
        );
      }

          shippedQuantity: "",
          salePrice: "",
          discountPercent: "100",
          batchNo: "",
        };
      }

      function getShipmentNoForMethod(method, currentShipmentNo = "") {
        if (method === "面交") return "N/A";
        return currentShipmentNo === "N/A" ? "" : currentShipmentNo;
      }

      function validateOrderDraft(draft, productMap = {}, fabrics = []) {
        const errors = [];
        const orderNo = String(draft.orderNo || "").trim();
        const customerKeyword = String(draft.customerKeyword || "").trim();
        const activeItems = draft.items.filter((item) => {
          const productKeyword = String(item.productKeyword || "").trim();
          const productName = String(item.productName || "").trim();
          return item.productId || productKeyword || productName || item.quantity;
        });

        if (!orderNo) errors.push("訂單編號：請輸入文字或數字，例如 SO-20260909-001。");
        if (!draft.orderDate) errors.push("訂單成立日期：請選擇日期，格式為 YYYY-MM-DD。");
        if (!draft.customerId && !customerKeyword) errors.push("客戶資料：請搜尋並選擇客戶，或輸入客戶關鍵字。");
        if (!draft.paymentStatus) errors.push("收款狀態：請從訂金、已付款、分期、未付款中選擇。");
        if (activeItems.length === 0) errors.push("至少一筆商品資訊：請輸入商品編號或商品名稱。");

        activeItems.forEach((item, index) => {
          const itemLabel = `第 ${index + 1} 筆商品`;
          const productKeyword = String(item.productKeyword || "").trim();
          const productName = String(item.productName || "").trim();
          if (!item.productId && !productKeyword && !productName) {
            errors.push(`${itemLabel}：請輸入商品編號或商品名稱。`);
          }
          if (!Number(item.quantity) || Number(item.quantity) <= 0) {
            errors.push(`${itemLabel}：數量需為大於 0 的數字；商品件數請輸入整數。`);
          }
          const product = productMap[item.productId];
          if (isFabricProduct(product) && !String(item.batchNo || "").trim()) {
            errors.push(`${itemLabel}：布料批號為必填，請從該款布料的批號下拉選單選擇。`);
          }
        });

        return errors;
      }

      function calculateOrderItemSubtotal(item) {
        const qty = Number(item.quantity) || 0;
        const priceRatio = Math.min(Math.max(Number(item.discountPercent) || 0, 0), 100) / 100;
        return Math.round((Number(item.salePrice) || 0) * qty * priceRatio);
      }

      function calculateItemsSubtotal(items) {
        return items.reduce((sum, item) => sum + calculateOrderItemSubtotal(item), 0);
      }

      function getDraftTotalQuantity(draft) {
        return draft.items.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
      }

      function getPaymentStatus(order) {
        if (order.paymentStatus) return order.paymentStatus;
        return order.paid ? "已付款" : "未付款";
      }

      function requiresReceivedAmount(paymentStatus) {
        return ["訂金", "分期"].includes(paymentStatus);
      }

      function getReceivedAmount(draft) {
        const paymentStatus = getPaymentStatus(draft);
        const totalAmount = calculateDraftTotal(draft);
        if (paymentStatus === "已付款") return totalAmount;
        if (paymentStatus === "未付款") return 0;
        return Math.min(Math.max(Number(draft.receivedAmount) || 0, 0), totalAmount);
      }

      function getOutstandingAmount(draft) {
        return Math.max(calculateDraftTotal(draft) - getReceivedAmount(draft), 0);
      }

      function getOrderStatus(order) {
        const items = order.items?.length ? order.items : [{ quantity: order.qty, shippedQuantity: order.shipped ? order.qty : 0 }];
        if (isOrderFullyShipped({ ...order, items })) return "已出貨";
        if (items.some((item) => item.isPreorder)) return "預購";
        if (items.some((item) => (Number(item.shippedQuantity) || 0) > 0)) return "部分出貨";
        return "待出貨";
      }

      function isOrderFullyShipped(order) {
        const items = order.items?.length ? order.items : [{ quantity: order.qty, shippedQuantity: order.shipped ? order.qty : 0 }];
        const shippableItems = items.filter((item) => (Number(item.quantity) || 0) > 0);
        return shippableItems.length > 0 && shippableItems.every((item) => (Number(item.shippedQuantity) || 0) >= (Number(item.quantity) || 0));
      }

      function getOrderTransferReadiness(order) {
        const rule = stockFlowRelationRules.sales;
        const hasShipmentNo = Boolean(String(order.shipmentNo || "").trim());
        const needsInvoiceNumber = order.invoiceMethod && order.invoiceMethod !== "不開發票";
        const hasInvoiceNumber = Boolean(String(order.invoiceNumber || "").trim());
        const checks = {
          itemsFullyShipped: isOrderFullyShipped(order) && hasShipmentNo,
          paymentCompleted: getPaymentStatus(order) === "已付款",
          invoiceCompleted: !needsInvoiceNumber || hasInvoiceNumber,
        };
        return {
          rule,
          checks,
          ready: rule.completionRequirements.every((requirement) => Boolean(checks[requirement])),
          missing: rule.completionRequirements.filter((requirement) => !checks[requirement]),
        };
      }

      function canTransferOrderToShipment(order) {
        return getOrderTransferReadiness(order).ready;
      }

      function createShipmentFromOrder(order, productMap, index = 0) {
        const relationRule = stockFlowRelationRules.sales;
        return {
          id: order.orderNo || order.id,
          relationType: "order_to_shipment",
          relationRule: relationRule.targetDoc,
          source: order.id,
          sourceOrderIds: [order.id],
          sourceOrderItemIds: (order.items || []).map((item) => item.id).filter(Boolean),
          orderNo: order.orderNo || order.id,
          customer: order.customer,
          shippingMethod: order.shippingMethod || "",
          shipmentNo: order.shipmentNo || "",
          shippingCompletedDate: order.shippingCompletedDate || new Date().toISOString().slice(0, 10),
          paymentCompletedDate: order.paymentCompletedDate || "",
          receivedAmount: order.receivedAmount || 0,
          outstandingAmount: order.outstandingAmount || 0,
          amount: order.amount || 0,
          invoiceMethod: order.invoiceMethod || "不開發票",
          invoiceCopy: order.invoiceCopy || "",
          invoiceNumber: order.invoiceNumber || "",
          invoiceTaxId: order.invoiceTaxId || "",
          orderType: order.orderType || "",
          needsPinkoiReview: Boolean(order.needsPinkoiReview),
          productName: getOrderProductSummary(order, productMap),
          qty: order.qty,
          paymentStatus: getPaymentStatus(order),
          date: new Date().toISOString().slice(0, 10),
          type: "訂單轉出貨",
          items: order.items || [],
        };
      }

      function getRemainingShipmentQuantity(item) {
        const remaining = Math.max((Number(item.quantity) || 0) - (Number(item.shippedQuantity) || 0), 0);
        return item.batchNo ? normalizeFabricQuantity(remaining) : remaining;
      }

      function isOrderItemFullyShipped(item) {
        const orderedQty = Number(item.quantity) || 0;
        const shippedQty = Number(item.shippedQuantity) || 0;
        return orderedQty > 0 && shippedQty >= orderedQty;
      }

      function calculateDraftTotal(draft) {
        const subtotal = calculateItemsSubtotal(draft.items);
        const shippingFee = Number(draft.shippingFee) || 0;
        const discountAmount = Number(draft.discountAmount) || 0;
        return Math.max(subtotal + shippingFee - discountAmount, 0);
      }

      function getOrderProductSummary(order, productMap) {
        if (order.items?.length) {
          const names = order.items.map((item) => {
            const product = productMap[item.productId];
            return product?.name || item.productName || item.productKeyword || "自訂商品";
          });
          return names.length > 1 ? `${names[0]} 等 ${names.length} 項` : names[0];
        }
        return productMap[order.productId]?.name || order.productName || "未命名商品";
      }

      function getOrderInventoryItems(order, productMap, options = {}) {
        const rawItems = order.items?.length
          ? order.items
          : [{ productId: order.productId, quantity: order.qty, productName: order.productName }];

        const grouped = rawItems.reduce((map, item) => {
          const key = `${item.productId || item.productName || item.productKeyword || "custom"}::${item.batchNo || ""}`;
          const orderedQty = Number(item.quantity) || 0;
          const shippedQty = Number(item.shippedQuantity) || 0;
          const qty = options.remainingOnly ? Math.max(orderedQty - shippedQty, 0) : orderedQty;
          const current = map[key] || {
            product: productMap[item.productId],
            batchNo: item.batchNo || "",
            qty: 0,
          };
          current.qty += qty;
          map[key] = current;
          return map;
        }, {});

        return Object.values(grouped).filter((item) => item.qty > 0);
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
